apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: ${{ values.lifecycle }}
  owner: ${{ values.owner }}
  system: ${{ values.system }}
{% if values.database != 'none' or values.messaging %}
  dependsOn:
{% if values.database != 'none' %}
    - ${{ values.database }}
{% endif %}
{% if values.messaging %}
    - ${{ values.messaging }}
{% endif %}
{% endif %}
