openapi: 3.0.3
info:
  title: reader-profile-service
  version: 0.1.0
paths:
  /api/v1/profile/search:
    get:
      summary: Search public readers by display name or username
      description: >-
        Authenticated product-realm search (audience account, no additional scope).
        Case-insensitive literal substring; optional leading @ is ignored.
        Only profiles with is_public=true and PUBLIC profile visibility are returned.
        Empty queries return no users. No emails, biographies or identity-provider data are exposed.
        Profile identities are indexed on authenticated profile reads; existing custom names are preserved.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100, default: '' }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Stable name/subject ordered page of public readers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSearchPage' }
        '400': { description: Invalid query length or pagination }
        '401': { description: Missing or invalid product token }
        '403': { description: Request blocked by origin or authorization policy }
  /api/v1/profile:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Authenticated profile }
        '401': { description: Authentication required }
    put:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated authenticated profile }
        '401': { description: Authentication required }
  /api/v1/profile/privacy:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated privacy policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Privacy' }
        '401': { description: Authentication required }
    put:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Privacy' }
      responses:
        '200':
          description: Updated privacy policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Privacy' }
        '400': { description: Invalid visibility value }
        '401': { description: Authentication required }
  /api/v1/profile/public:
    get:
      parameters:
        - name: subject
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Public profile or an empty profile response }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SearchUser:
      type: object
      required: [subject]
      properties:
        subject: { type: string, description: Opaque profile identifier }
        displayName: { type: string, nullable: true }
        username: { type: string, nullable: true }
    UserSearchPage:
      type: object
      required: [items, totalItems, totalPages, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchUser' }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
    Privacy:
      type: object
      required: [profileVisibility, activityVisibility, libraryVisibility, recentVisibility, socialGraphVisibility]
      properties:
        profileVisibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }
        activityVisibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }
        libraryVisibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }
        recentVisibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }
        socialGraphVisibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }
