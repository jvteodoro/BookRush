openapi: 3.0.3
info:
  title: reader-profile-service
  version: 0.2.0
  description: Perfis de leitores e preferências granulares de privacidade.
servers:
  - url: /
paths:
  /api/v1/profile:
    get:
      summary: Retorna o perfil autenticado e suas preferências
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil e preferências atuais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Token ausente, inválido ou expirado
        "403":
          description: Token sem autorização para o produto
    put:
      summary: Atualiza parcialmente perfil e preferências de privacidade
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Audiência diferente de PUBLIC, FOLLOWERS ou PRIVATE
        "401":
          description: Token ausente, inválido ou expirado
        "403":
          description: Token sem autorização para o produto
  /api/v1/profile/public:
    get:
      summary: Retorna os campos públicos de um perfil
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: subject
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Perfil público ou resposta vazia quando não for público
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401":
          description: Token ausente, inválido ou expirado
        "403":
          description: Token sem autorização para o produto
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Visibility:
      type: string
      enum: [PUBLIC, FOLLOWERS, PRIVATE]
    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        isPublic:
          type: boolean
          deprecated: true
        profileVisibility:
          $ref: "#/components/schemas/Visibility"
        activityVisibility:
          $ref: "#/components/schemas/Visibility"
        libraryVisibility:
          $ref: "#/components/schemas/Visibility"
        recentVisibility:
          $ref: "#/components/schemas/Visibility"
        socialGraphVisibility:
          $ref: "#/components/schemas/Visibility"
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileUpdate"
        - type: object
          required:
            - subject
            - isPublic
            - profileVisibility
            - activityVisibility
            - libraryVisibility
            - recentVisibility
            - socialGraphVisibility
          properties:
            subject:
              type: string
            updatedAt:
              type: string
              format: date-time
    PublicProfile:
      type: object
      required: [subject, displayName]
      properties:
        subject:
          type: string
        displayName:
          type: string
        bio:
          type: string
