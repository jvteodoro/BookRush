spring:
  application:
    name: book-ingestion-service
  main:
    web-application-type: ${INGESTION_WEB_APPLICATION_TYPE:servlet}
  batch:
    job:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${INGESTION_PORT:8090}
  shutdown: graceful

springdoc:
  api-docs:
    path: /ingestion-docs/v3/api-docs
  swagger-ui:
    path: /ingestion-docs/swagger-ui.html
    config-url: /ingestion-docs/v3/api-docs/swagger-config
    disable-swagger-default-url: true
    url: /ingestion-docs/v3/api-docs

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true

ingestion:
  role: ${INGESTION_ROLE:ALL}
  scheduler-enabled: ${INGESTION_SCHEDULER_ENABLED:false}
  staging-root: ${INGESTION_STAGING_ROOT:/var/lib/bookrush/ingestion}
  worker-threads: ${INGESTION_WORKER_THREADS:2}
  chunk-size: ${INGESTION_CHUNK_SIZE:100}
  lease-seconds: ${INGESTION_LEASE_SECONDS:120}
  heartbeat-seconds: ${INGESTION_HEARTBEAT_SECONDS:30}
  max-record-bytes: ${INGESTION_MAX_RECORD_BYTES:16777216}
  max-asset-bytes: ${INGESTION_MAX_ASSET_BYTES:104857600}
  max-uncompressed-bytes: ${INGESTION_MAX_UNCOMPRESSED_BYTES:524288000}
  max-entries: ${INGESTION_MAX_ENTRIES:10000}
  max-processing-seconds: ${INGESTION_MAX_PROCESSING_SECONDS:120}
  request-timeout: ${INGESTION_REQUEST_TIMEOUT:30s}
  max-requests-per-second: ${INGESTION_MAX_REQUESTS_PER_SECOND:2}
  retention-days: ${INGESTION_RETENTION_DAYS:7}
  storage:
    endpoint: ${INGESTION_STORAGE_ENDPOINT:http://localhost:18333}
    region: ${INGESTION_STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style: ${INGESTION_STORAGE_PATH_STYLE:true}
    raw-bucket: ${STORAGE_BUCKET_RAW:books-raw}
    timeout: ${INGESTION_STORAGE_TIMEOUT:30s}
  security:
    enabled: ${INGESTION_SECURITY_ENABLED:false}
    issuer: ${INGESTION_OIDC_ISSUER:http://localhost:8081/realms/bookrush}
    audience: ${INGESTION_OIDC_AUDIENCE:bookrush-ingestion}
    jwk-set-uri: ${INGESTION_OIDC_JWK_SET_URI:http://localhost:8081/realms/bookrush/protocol/openid-connect/certs}
    local-fixture-mode: ${INGESTION_SECURITY_LOCAL_FIXTURE_MODE:false}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
    service-token: ${CANONICAL_SERVICE_TOKEN:}
    request-timeout: ${CATALOG_SERVICE_REQUEST_TIMEOUT:30s}
