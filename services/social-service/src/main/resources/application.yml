server:
  port: ${SERVER_PORT:8096}
spring:
  config:
    import: optional:classpath:bookrush-observability.yml
  application:
    name: social-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
  flyway:
    enabled: true
    schemas: social
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BOOKRUSH_SECURITY_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
          jwk-set-uri: ${BOOKRUSH_SECURITY_JWK_SET_URI:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
bookrush:
  product-human-clients: ${COMMUNITY_PRODUCT_HUMAN_CLIENTS:bookrush-web,bookrush-mobile}
  security:
    product-access:
      enabled: ${COMMUNITY_PRODUCT_ACCESS_ENABLED:false}
      decision-base-uri: ${COMMUNITY_PRODUCT_ACCESS_ORIGIN:}
      token-uri: ${COMMUNITY_PRODUCT_ACCESS_TOKEN_URI:}
      jwk-set-uri: ${COMMUNITY_PRODUCT_ACCESS_JWKS_URI:}
      workload-issuer: ${COMMUNITY_PRODUCT_ACCESS_WORKLOAD_ISSUER:}
      client-id: ${COMMUNITY_PRODUCT_ACCESS_CLIENT_ID:}
      client-secret: ${COMMUNITY_PRODUCT_ACCESS_CLIENT_SECRET:}
      allow-insecure-http: ${COMMUNITY_PRODUCT_ACCESS_ALLOW_INSECURE_HTTP:false}
    enabled: ${BOOKRUSH_SECURITY_ENABLED:false}
    audience: ${BOOKRUSH_SECURITY_AUDIENCE:bookrush-ingestion}
  cors:
    allowed-origins: ${BOOKRUSH_CORS_ALLOWED_ORIGINS:https://bookrush.jteodoro.tec.br,http://localhost:18080}
  social:
    supervision-enabled: ${SOCIAL_SUPERVISED_COMMENTS_ENABLED:false}
    admin-issuer: ${SOCIAL_ADMIN_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
    admin-jwks: ${SOCIAL_ADMIN_JWKS:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
    admin-audience: ${SOCIAL_ADMIN_AUDIENCE:bookrush-ingestion}
