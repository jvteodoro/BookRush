        '401': { description: Authentication required }
        '403': { description: Reporting analyst role required }
  /api/admin/v1/reporting/export/{dataset}:
    get:
      summary: Export a bounded aggregate reporting dataset as CSV
      description: Operator-only allowlisted exports. Each successful export writes a REPORTING_DATA_EXPORTED audit entry; book engagement export enforces a minimum of five readers.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dataset, in: path, required: true, schema: { type: string, enum: [reader-day, feed-daily, recommendation-daily, recommendation-quality, recommendation-profile-quality, moderation-daily, social-daily, book-engagement, rights-status-daily] } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
      responses:
        '200':
          description: UTF-8 CSV download, maximum 10000 rows
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { description: Invalid dataset or date range }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '413': { description: Export exceeds the row limit }
  /api/admin/v1/reporting/internal/release-events:
    post:
      summary: Persist an idempotent Jenkins build, deploy or rollback event
      description: >-
        Server-to-server only. Requires the bookrush-platform issuer,
        bookrush-admin-reporting audience and
        bookrush.reporting.release.write scope. Reusing eventId with the same
        release metadata is idempotent; the first accepted occurredAt is
        retained. Reusing it with different release metadata returns 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseEventRequest' }
      responses:
        '200': { description: Event accepted or identical retry; eventId and stored status returned }
        '400': { description: Invalid event fields or service/event type combination }
        '401': { description: Missing or invalid S2S token }
        '403': { description: Missing release reporting scope }
        '409': { description: eventId already exists with different metadata }
  /api/admin/v1/reporting/release-events:
    get:
      summary: Read recent Jenkins build and release events
      description: Reporting analyst role required. Returns the configured number of newest events, bounded to 500.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Release event timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { description: Invalid days or limit }
        '401': { description: Authentication required }
        '403': { description: Reporting analyst role required }
  /api/v1/admin/feed:
    get:
      summary: Read the versioned recommendation ledger for Feed Lab
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Read-only recommendation items with privacy-safe provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedLabResponse' }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
  /api/v1/admin/users:
    get:
      summary: Search product-realm users
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated users from the product Keycloak realm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { description: Invalid pagination }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '503': { description: Product-realm management client is not configured }
  /api/v1/admin/users/{subjectKey}/disable:
    post:
      summary: Disable a product user and revoke active sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: subjectKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusChange' }
      responses:
        '200': { description: User disabled and action audited }
        '400': { description: Invalid reason }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Product user not found }
        '409': { description: Operator cannot modify their own account }
        '502': { description: Keycloak rejected the operation }
        '503': { description: Product-realm management client is not configured }
  /api/v1/admin/users/{subjectKey}/enable:
    post:
      summary: Re-enable a product user
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: subjectKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusChange' }
      responses:
        '200': { description: User enabled and action audited }
        '400': { description: Invalid reason }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Product user not found }
        '409': { description: Operator cannot modify their own account }
        '502': { description: Keycloak rejected the operation }
        '503': { description: Product-realm management client is not configured }
  /api/v1/admin/reports:
    get:
      summary: List moderation reports, including reported comments
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reports ordered from newest to oldest }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
  /api/v1/admin/reports/{reportId}/status:
    post:
      summary: Move a report through the audited moderation lifecycle
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED] }
                note: { type: string, maxLength: 200 }
      responses:
        '200': { description: Report status changed and audit entry recorded }
        '400': { description: Invalid status or missing terminal-decision note }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Report not found }
  /api/v1/admin/moderation/comments:
    get:
      summary: List comments and their current moderation visibility
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Comments with VISIBLE, HIDDEN or REMOVED state }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
    post:
      summary: Change comment visibility, creating missing legacy state when needed
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commentId, visibility, reasonCode]
              properties:
                commentId: { type: string, format: uuid }
                visibility: { type: string, enum: [VISIBLE, HIDDEN, REMOVED] }
                reasonCode: { type: string, minLength: 3, maxLength: 80 }
      responses:
        '200': { description: Visibility and audit saved atomically; updated is false for an unchanged state }
        '400': { description: Invalid comment ID or visibility }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Comment not found }
        '409': { description: A comment removed by its author cannot be restored }
  /api/v1/admin/moderation/comments/page:
    get:
      summary: Search comments by text, author, comment ID or book ID with visibility filter and stable pagination
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200, default: '' } }
        - { name: visibility, in: query, schema: { type: string, enum: ['', VISIBLE, HIDDEN, REMOVED], default: '' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated comments, including legacy rows with implicit VISIBLE state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400': { description: Invalid filters or pagination }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
  /api/v1/admin/moderation/comments/{commentId}/history:
    get:
      summary: Read the latest 100 immutable comment decisions, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Actor, previous and new visibility, reason and date for each decision
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommentDecision' }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Comment not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ReleaseEventRequest:
      type: object
      additionalProperties: false
      required: [eventId, jobName, buildNumber, eventType, status, occurredAt]
      properties:
        eventId: { type: string, maxLength: 220, pattern: '^[A-Za-z0-9._:/#-]+$' }
        jobName: { type: string, minLength: 1, maxLength: 180 }
        buildNumber: { type: integer, format: int64, minimum: 1 }
        buildUrl: { type: string, maxLength: 1024 }
        branch: { type: string, maxLength: 180 }
        gitCommit: { type: string, pattern: '^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$' }
        eventType: { type: string, enum: [BUILD, DEPLOY, ROLLBACK] }
        status: { type: string, enum: [STARTED, SUCCESS, FAILURE, UNSTABLE, ABORTED] }
        serviceName: { type: string, maxLength: 120 }
        imageRef: { type: string, maxLength: 512 }
        imageDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        durationMs: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        occurredAt: { type: string, format: date-time }
    ModeratedComment:
      type: object
      required: [id, book_id, subject_key, author_name, body, visibility, created_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        subject_key: { type: string }
        author_name: { type: string }
        body: { type: string }
        visibility: { type: string, enum: [VISIBLE, HIDDEN, REMOVED] }
        author_deleted_at: { type: string, format: date-time, nullable: true }
        reason_code: { type: string, nullable: true }
        updated_by_subject: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CommentPage:
      type: object
      required: [items, page, size, totalItems, last]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ModeratedComment' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        last: { type: boolean }
    CommentDecision:
      type: object
      required: [id, actor_subject, created_at, previous_visibility, visibility, reason]
      properties:
        id: { type: string, format: uuid }
        actor_subject: { type: string }
        created_at: { type: string, format: date-time }
        previous_visibility: { type: string, enum: [VISIBLE, HIDDEN, REMOVED] }
        visibility: { type: string, enum: [VISIBLE, HIDDEN, REMOVED] }
        reason: { type: string }
    UserStatusChange:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }
    AdminUser:
      type: object
      required: [subjectKey, username, enabled]
      properties:
        subjectKey: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        enabled: { type: boolean }
        createdTimestamp: { type: integer, format: int64 }
    UserPage:
      type: object
      required: [items, page, size, totalItems, last]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        last: { type: boolean }
    FeedLabResponse:
      type: object
      required: [items, source, readOnly]
      properties:
        source: { type: string, example: recommendation-ledger-v1 }
        readOnly: { type: boolean, example: true }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    DashboardResponse:
      type: object
      required: [schemaVersion, metricId, definitionVersion, status, unit, population, series]
      properties:
        schemaVersion: { type: string, example: dashboard-response-v1 }
        metricId: { type: string, example: reader_day }
        definitionVersion: { type: string, example: events-v1-untrusted-population }
        status: { type: string, enum: [OK, NO_DATA, NOT_INSTRUMENTED, STALE, RESTRICTED, ERROR, INSUFFICIENT_SAMPLE, UNTRUSTED] }
        unit: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        population: { type: string, example: UNCLASSIFIED }
        sourceWatermark: { type: string, format: date-time, nullable: true }
        refreshedAt: { type: string, format: date-time, nullable: true }
        freshnessSeconds: { type: integer, format: int64, nullable: true }
        warnings: { type: array, items: { type: string } }
        series: { type: array, items: { type: object, additionalProperties: true } }
        page: { type: integer, minimum: 0, nullable: true }
        pageSize: { type: integer, minimum: 1, nullable: true }
        hasNext: { type: boolean, nullable: true }
