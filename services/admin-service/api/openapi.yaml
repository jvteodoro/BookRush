openapi: 3.0.3
info:
  title: BookRush Admin API
  version: 0.3.0
  description: Administrative user lifecycle and audit operations.
paths:
  /api/v1/admin/feed:
    get:
      summary: Read the versioned recommendation ledger for Feed Lab
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Read-only recommendation items with privacy-safe provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedLabResponse' }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
  /api/v1/admin/users:
    get:
      summary: Search product-realm users
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated users from the product Keycloak realm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { description: Invalid pagination }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '503': { description: Product-realm management client is not configured }
  /api/v1/admin/users/{subjectKey}/disable:
    post:
      summary: Disable a product user and revoke active sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: subjectKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusChange' }
      responses:
        '200': { description: User disabled and action audited }
        '400': { description: Invalid reason }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Product user not found }
        '409': { description: Operator cannot modify their own account }
        '502': { description: Keycloak rejected the operation }
        '503': { description: Product-realm management client is not configured }
  /api/v1/admin/users/{subjectKey}/enable:
    post:
      summary: Re-enable a product user
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: subjectKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusChange' }
      responses:
        '200': { description: User enabled and action audited }
        '400': { description: Invalid reason }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Product user not found }
        '409': { description: Operator cannot modify their own account }
        '502': { description: Keycloak rejected the operation }
        '503': { description: Product-realm management client is not configured }
  /api/v1/admin/reports:
    get:
      summary: List moderation reports, including reported comments
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reports ordered from newest to oldest }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
  /api/v1/admin/reports/{reportId}/status:
    post:
      summary: Move a report through the audited moderation lifecycle
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED] }
                note: { type: string, maxLength: 200 }
      responses:
        '200': { description: Report status changed and audit entry recorded }
        '400': { description: Invalid status or missing terminal-decision note }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Report not found }
  /api/v1/admin/moderation/comments:
    get:
      summary: List comments and their current moderation visibility
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Comments with VISIBLE, HIDDEN or REMOVED state }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
    post:
      summary: Change comment visibility, creating missing legacy state when needed
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commentId, visibility, reasonCode]
              properties:
                commentId: { type: string, format: uuid }
                visibility: { type: string, enum: [VISIBLE, HIDDEN, REMOVED] }
                reasonCode: { type: string, minLength: 3, maxLength: 80 }
      responses:
        '200': { description: Visibility and audit saved atomically; updated is false for an unchanged state }
        '400': { description: Invalid comment ID or visibility }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Comment not found }
        '409': { description: A comment removed by its author cannot be restored }
  /api/v1/admin/moderation/comments/page:
    get:
      summary: Search comments by text, author, comment ID or book ID with visibility filter and stable pagination
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200, default: '' } }
        - { name: visibility, in: query, schema: { type: string, enum: ['', VISIBLE, HIDDEN, REMOVED], default: '' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated comments, including legacy rows with implicit VISIBLE state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400': { description: Invalid filters or pagination }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
  /api/v1/admin/moderation/comments/{commentId}/history:
    get:
      summary: Read the latest 100 immutable comment decisions, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Actor, previous and new visibility, reason and date for each decision
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommentDecision' }
        '401': { description: Authentication required }
        '403': { description: Platform operator role required }
        '404': { description: Comment not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ModeratedComment:
      type: object
      required: [id, book_id, subject_key, author_name, body, visibility, created_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        subject_key: { type: string }
        author_name: { type: string }
        body: { type: string }
        visibility: { type: string, enum: [VISIBLE, HIDDEN, REMOVED] }
        author_deleted_at: { type: string, format: date-time, nullable: true }
        reason_code: { type: string, nullable: true }
        updated_by_subject: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CommentPage:
      type: object
      required: [items, page, size, totalItems, last]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ModeratedComment' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        last: { type: boolean }
    CommentDecision:
      type: object
      required: [id, actor_subject, created_at, previous_visibility, visibility, reason]
      properties:
        id: { type: string, format: uuid }
        actor_subject: { type: string }
        created_at: { type: string, format: date-time }
        previous_visibility: { type: string, enum: [VISIBLE, HIDDEN, REMOVED] }
        visibility: { type: string, enum: [VISIBLE, HIDDEN, REMOVED] }
        reason: { type: string }
    UserStatusChange:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }
    AdminUser:
      type: object
      required: [subjectKey, username, enabled]
      properties:
        subjectKey: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        enabled: { type: boolean }
        createdTimestamp: { type: integer, format: int64 }
    UserPage:
      type: object
      required: [items, page, size, totalItems, last]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        last: { type: boolean }
    FeedLabResponse:
      type: object
      required: [items, source, readOnly]
      properties:
        source: { type: string, example: recommendation-ledger-v1 }
        readOnly: { type: boolean, example: true }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
