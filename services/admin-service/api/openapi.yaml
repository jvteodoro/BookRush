openapi: 3.0.3
info:
  title: BookRush Admin API
  version: 0.3.0
  description: Administrative user lifecycle and audit operations.
paths:
  /api/admin/v1/reporting/executive-summary:
    get:
      summary: Read executive KPIs with cross-platform unique-user peak and previous-period comparison
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
      responses:
        '200':
          description: Current and previous period aggregates; daily_peak_users is distinct by issuer and subject across all platforms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { description: Invalid date range }
        '401': { description: Authentication required }
        '403': { description: Reporting analyst role required }
  /api/admin/v1/reporting/reader-day:
    get:
      summary: Read reader-day snapshots with users distinct by issuer and subject
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
      responses:
        '200':
          description: Reporting response with freshness and explicit data state; unique-user counts require both identity issuer and subject and retain platform dimensions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { description: Invalid date range }
        '401': { description: Authentication required }
        '403': { description: Reporting analyst role required }
  /api/admin/v1/reporting/health:
    get:
      summary: Read projection freshness and refresh state
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Projection health rows }
        '401': { description: Authentication required }
        '403': { description: Reporting analyst role required }
  /api/admin/v1/reporting/feed-daily:
    get:
      summary: Read feed delivery, mature seven-day viewable CTR, dwell visits and explicit skips
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
      responses:
        '200':
          description: Feed reporting response with explicit attribution and population state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { description: Invalid date range }
        '401': { description: Authentication required }
        '403': { description: Reporting analyst role required }
  /api/admin/v1/reporting/pipeline:
