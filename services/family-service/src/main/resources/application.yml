server:
  port: ${SERVER_PORT:8103}
spring:
  config:
    import: optional:classpath:bookrush-observability.yml
  application:
    name: family-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookrush}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 2000
  flyway:
    schemas: family
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
bookrush:
  security:
    enabled: true
    issuer: ${FAMILY_PRODUCT_ISSUER}
    jwk-set-uri: ${FAMILY_PRODUCT_JWKS}
    audience: bookrush-family
family:
  cors-origins: ${FAMILY_CORS_ORIGINS:}
  subscription-url: ${FAMILY_SUBSCRIPTION_URL:http://subscription-service:8102}
  token-url: ${FAMILY_TOKEN_URL}
  client-id: ${FAMILY_SUBSCRIPTION_CLIENT:bookrush-family-s2s}
  client-secret: ${FAMILY_SUBSCRIPTION_CLIENT_SECRET:}
  expiration-delay: ${FAMILY_EXPIRATION_DELAY_MS:60000}
  workload-issuer: ${FAMILY_WORKLOAD_ISSUER}
  workload-jwks: ${FAMILY_WORKLOAD_JWKS}
  membership-client: ${FAMILY_MEMBERSHIP_CLIENT:bookrush-product-access-s2s}
  identity-admin-users: ${FAMILY_IDENTITY_ADMIN_USERS:}
  identity-token-url: ${FAMILY_IDENTITY_TOKEN_URL:}
  identity-secret: ${FAMILY_IDENTITY_CLIENT_SECRET:}
  supervision-admin-client: ${FAMILY_SUPERVISION_ADMIN_CLIENT:bookrush-supervision-admin-s2s}
  supervision-simulation: ${FAMILY_SUPERVISION_SIMULATION:false}
  supervision-maintenance-delay: ${FAMILY_SUPERVISION_MAINTENANCE_DELAY_MS:60000}
  product-access-workloads: ${FAMILY_PRODUCT_ACCESS_WORKLOADS:}
  product-access-age-verification-required: ${FAMILY_PRODUCT_ACCESS_AGE_VERIFICATION_REQUIRED:false}
  supervision-simulated-approval: ${FAMILY_SUPERVISION_SIMULATED_APPROVAL:false}
