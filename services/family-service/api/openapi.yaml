          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    InvitationRequest:
      type: object
      required:
      - recipientCode
      additionalProperties: false
      properties:
        recipientCode:
          type: string
          format: uuid
    Invitation:
      type: object
      required:
      - id
      - householdId
      - state
      - expiresAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - DECLINED
          - CANCELED
          - EXPIRED
        expiresAt:
          type: string
          format: date-time
    Accepted:
      type: object
      additionalProperties: false
      required:
      - householdId
      - membershipId
      properties:
        householdId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
    StateChange:
      type: object
      additionalProperties: false
      required:
      - state
      - expectedVersion
      properties:
        state:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    DelegationChange:
      type: object
      additionalProperties: false
      required:
      - canPublish
      - expectedVersion
      properties:
        canPublish:
          type: boolean
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    MembershipQuery:
      type: object
      additionalProperties: false
      required:
      - issuer
      - subject
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 512
        subject:
          type: string
          minLength: 1
          maxLength: 255
    MembershipFacts:
      type: object
      additionalProperties: false
      required:
      - state
      - householdId
      - membershipId
      - delegationEnabled
      - membershipVersion
      - permissionVersion
      - holderPremiumUntil
      properties:
        state:
          type: string
          enum:
          - ABSENT
          - ACTIVE
          - SUSPENDED
        householdId:
          type: string
          format: uuid
