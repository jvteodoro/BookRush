server:
  port: ${SERVER_PORT:8094}
spring:
  config:
    import: optional:classpath:bookrush-observability.yml
  application:
    name: reader-state-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
  flyway:
    enabled: true
    schemas: reader_state
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
bookrush:
  security:
    enabled: ${BOOKRUSH_SECURITY_ENABLED:false}
