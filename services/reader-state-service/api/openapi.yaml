openapi: 3.0.3
info:
  title: reader-state-service
  version: 0.1.0
  description: Estado privado de leitura e projeção versionada da planta.
servers:
  - url: https://bookrush.jteodoro.tec.br
paths:
  /api/v1/reader/books/{bookId}/bookmarks/{bookmarkId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: bookmarkId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Rename a bookmark owned by the authenticated reader
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120, description: Trimmed display name; whitespace-only values are rejected }
      responses:
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Bookmark renamed without changing its position or creation date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '400': { description: Invalid UUID or name }
        '401': { description: Authentication required }
        '403': { description: Forbidden origin or token authorization }
        '404': { description: Bookmark not found for this reader and book }
    delete:
      summary: Delete a bookmark owned by the authenticated reader
      security: [{ bearerAuth: [] }]
      responses:
        '503': { description: Current product authorization is unavailable }
        '204': { description: Bookmark deleted }
        '400': { description: Invalid UUID }
        '401': { description: Authentication required }
        '403': { description: Forbidden origin or token authorization }
        '404': { description: Bookmark not found for this reader and book }
  /api/v1/reader/books/{bookId}/bookmarks:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List the authenticated reader's bookmarks, newest first
      security: [{ bearerAuth: [] }]
      responses:
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Bookmarks; legacy entries have a null locator
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Bookmark' } }
        '400': { description: Invalid book UUID }
        '401': { description: Authentication required }
        '403': { description: Forbidden origin or token authorization }
    post:
      summary: Save a Readium locator, returning the existing ID on repeated saves
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [locator]
                - required: [positionCodepoint]
              properties:
                locator: { $ref: '#/components/schemas/BookmarkLocator' }
                positionCodepoint: { type: integer, format: int64, minimum: 0, deprecated: true, description: Legacy codepoint; never send a percentage here }
                name: { type: string, minLength: 1, maxLength: 120, description: Optional for legacy clients; nonblank when supplied }
                note: { type: string }
      responses:
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Persisted bookmark (including its stable ID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '400': { description: Missing position or invalid Readium locator }
        '401': { description: Authentication required }
        '403': { description: Forbidden origin or token authorization }
  /api/v1/reader/sessions:
    post:
      operationId: startReaderSession
      summary: Iniciar uma sessão de leitura
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-BookRush-Recommendation-Item, in: header, schema: { type: string, format: uuid } }
        - { name: X-BookRush-Impression, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId: { type: string, format: uuid, nullable: true }
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200': { description: Sessão criada }
        '401': { description: Token ausente ou inválido }
  /api/v1/reader/sessions/{id}/end:
    post:
      operationId: endReaderSession
      summary: Encerrar uma sessão de leitura
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activeSeconds]
              properties:
                activeSeconds: { type: integer, minimum: 0, description: Tempo ativo informado pelo cliente; o servidor limita ao tempo decorrido desde o início da sessão e a 24 horas. }
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Sessão encerrada. activeSeconds na resposta e em READ_SESSION contém o menor valor entre o tempo informado, o tempo decorrido e 86400 segundos.
          content:
            application/json:
              schema:
                type: object
                required: [id, activeSeconds, plant]
                properties:
                  id: { type: string, format: uuid }
                  activeSeconds: { type: integer, minimum: 0, maximum: 86400 }
                  plant: { type: object, additionalProperties: true }
        '401': { description: Token ausente ou inválido }
        '404': { description: Sessão inexistente ou não pertencente ao leitor }
  /api/v1/reader/books/{bookId}/progress:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read the authenticated reader's last position for automatic resume
      security: [{ bearerAuth: [] }]
      responses:
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Empty array for a new reader/book; otherwise one saved progress record
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items: { $ref: '#/components/schemas/ReadingProgress' }
        '400': { description: Invalid book UUID }
        '401': { description: Authentication required }
        '403': { description: Forbidden origin or token authorization }
    put:
      summary: Save the latest reading position and publish progress outcomes
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-BookRush-Recommendation-Item, in: header, schema: { type: string, format: uuid } }
        - { name: X-BookRush-Impression, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionCodepoint, percent]
              properties:
                positionCodepoint: { type: integer, format: int64, minimum: 0, description: Zero for locator-based progress; never a rounded percentage }
                percent: { type: number, minimum: 0, maximum: 100 }
                locator: { $ref: '#/components/schemas/BookmarkLocator' }
      responses:
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Last position updated (including backwards navigation)
          content:
            application/json:
              schema:
                type: object
                required: [bookId, percent]
                properties:
                  bookId: { type: string, format: uuid }
                  percent: { type: number, minimum: 0, maximum: 100 }
        '400': { description: Invalid progress or locator }
        '401': { description: Authentication required }
        '403': { description: Forbidden origin or token authorization }
  /api/v1/reader/books/{bookId}/opened:
    post:
      summary: Record a successfully loaded reading and mark the book as seen
      description: Called only after content loads. Atomically records history and seen status for the authenticated subject; reopening preserves firstSeenAt. Does not mark a book as completed.
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, format: uuid}, description: Repeat the same key for retries of the same loaded publication.}
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '503': { description: Current product authorization is unavailable }
        '200': {description: Opening recorded and private seen status persisted}
        '400': {description: Invalid book ID}
        '401': {description: Authentication required}
        '403': {description: Disallowed CORS origin}

  /api/v1/reader/books/seen:
    get:
      summary: Read private seen status for a bounded batch of books
      description: A book is seen after its content loads in the reader, not after a feed impression. Product realm, audience account, no extra scope. Only the authenticated subject is queried; the result is independent of the recent-history limit.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Seen entries from the requested batch; unseen books are absent
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [bookId, firstSeenAt, lastSeenAt]
                      properties:
                        bookId: {type: string, format: uuid}
                        firstSeenAt: {type: string, format: date-time}
                        lastSeenAt: {type: string, format: date-time}
        '400': {description: "Missing, malformed or oversized book ID batch"}
        '401': {description: "Missing, invalid, expired or wrong-audience product token"}
        '403': {description: Disallowed CORS origin}

  /api/v1/reader/plant:
    get:
      operationId: getReaderPlant
      summary: Obter a projeção de crescimento do leitor
      security:
        - bearerAuth: []
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Projeção persistida e recalculada para o subject autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantState'
        '401':
          description: Token ausente ou inválido.
    post:
      operationId: recordPlantReadingTime
      summary: Registrar um intervalo de leitura visível
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, activeSeconds, endedAt]
              properties:
                eventId: { type: string, format: uuid }
                activeSeconds: { type: integer, minimum: 1, maximum: 60 }
                endedAt: { type: string, format: date-time }
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Estado atualizado; repetições do mesmo eventId são idempotentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantState' }
        '400': { description: Intervalo inválido ou fora da janela permitida. }
        '401': { description: Token ausente ou inválido. }
  /api/v1/reader/library:
    get:
      security:
      - bearerAuth: []
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Saved books for the authenticated reader, including books outside
            the current feed
        '401':
          description: Authentication required
          description: Reader state service unavailable
  /api/v1/reader/library/{bookId}:
    put:
      description: Saves the book identified by the path for the authenticated reader.
        No request body is required.
      security:
      - bearerAuth: []
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Library entry saved for the authenticated reader; repeated saves
            do not create duplicates
        '400':
          description: Invalid book UUID
        '401':
          description: Authentication required
          description: Reader state service unavailable
    delete:
      security:
      - bearerAuth: []
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Library entry removed for the authenticated reader; repeated
            removals succeed
        '400':
          description: Invalid book UUID
        '401':
          description: Authentication required
          description: Reader state service unavailable
  /api/v1/reader/recent:
    get:
      security:
      - bearerAuth: []
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Recent books
        '401':
          description: Authentication required
          description: Reader state service unavailable
  /api/v1/reader/streak:
    get:
      security:
      - bearerAuth: []
      responses:
        '403': { description: Current product policy denies access }
        '503': { description: Current product authorization is unavailable }
        '200':
          description: Reading streak
        '401':
          description: Authentication required
          description: Reader state service unavailable
  /api/internal/v1/reader/supervision/{memberId}/history:
    get:
      operationId: supervisedReadingHistory
      summary: Read one page of the authorized minor reading projection
      description: The memberId is the UUID of the guardian’s own supervision grant. Each page requires an active grant for the exact scope. Tokens use realm bookrush, audience bookrush-reader-bff and scope supervision.read.
      security: [{ bearerAuth: [], supervisionWorkload: [] }]
      parameters:
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: scope, in: query, required: true, schema: {type: string, enum: [BOOKS_ACCESSED, READING_ACTIVITY]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}, description: Opaque cursor bound to this request context.}
      responses:
        '200':
          description: Projection page, possibly empty after authorization
          headers:
            Cache-Control: {schema: {type: string, example: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupervisedReadingPage'}
        '400': {description: Invalid scope or pagination parameters}
        '401': {description: Missing or invalid authentication}
        '403': {description: Authorization denied or grant no longer applies}
        '404': {description: No matching grant visible to this guardian}
        '503': {description: A required dependency could not authorize or return the page}

components:
  securitySchemes:
    supervisionWorkload:
      type: apiKey
      in: header
      name: X-BookRush-Workload
      description: Signed platform JWT for bookrush-reader-bff-supervision-s2s with audience bookrush-reader-state-supervision and scope supervision.history.read.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SupervisedReadingPage:
      type: object
      required: [scope, items]
      properties:
        scope: {type: string, enum: [BOOKS_ACCESSED, READING_ACTIVITY]}
        nextCursor: {type: string, format: uuid, nullable: true}
        items:
          type: array
          maxItems: 50
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [bookId, accessedAt]
                properties:
                  bookId: {type: string, format: uuid}
                  accessedAt: {type: string, format: date-time}
              - type: object
                additionalProperties: false
                required: [date, minutes, sessions]
                properties:
                  date: {type: string, format: date}
                  minutes: {type: integer, format: int64, minimum: 0}
                  sessions: {type: integer, format: int64, minimum: 1}
    ReadingProgress:
      type: object
      required: [position_codepoint, percent, updated_at]
      properties:
        position_codepoint: { type: integer, format: int64, minimum: 0 }
        percent: { type: number, minimum: 0, maximum: 100 }
        locator: { type: string, nullable: true, description: Serialized Readium locator JSON; absent/null for legacy progress }
        updated_at: { type: string, format: date-time }
    BookmarkLocator:
      type: object
      required: [href, type, locations]
      properties:
        href: { type: string, minLength: 1, description: Resource href from the versioned publication manifest }
        type: { type: string, minLength: 1 }
        title: { type: string }
        locations:
          type: object
          required: [progression]
          properties:
            progression: { type: number, minimum: 0, maximum: 1 }
            totalProgression: { type: number, minimum: 0, maximum: 1 }
            position: { type: integer, minimum: 1 }
        text: { type: object }
    Bookmark:
      type: object
      required: [id, position_codepoint, note, created_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        position_codepoint: { type: integer, format: int64, minimum: 0, description: Zero for locator-only bookmarks }
        name: { type: string, maxLength: 120, description: Empty for unnamed legacy bookmarks }
        note: { type: string }
        locator: { type: string, nullable: true, description: Serialized BookmarkLocator JSON; null for legacy bookmarks }
        created_at: { type: string, format: date-time }
    PlantState:
      type: object
      required: [formulaVersion, stage, sad, streakDays, todaySeconds, goalSeconds, goalReached, totalReadingMinutes, measuredUntil]
      properties:
        formulaVersion: { type: string, example: daily-reading-v2 }
        stage: { type: integer, minimum: 0, maximum: 5 }
        sad: { type: boolean }
        todaySeconds: { type: integer, minimum: 0 }
        goalSeconds: { type: integer, example: 900 }
        goalReached: { type: boolean }
        streakDays: { type: integer, minimum: 0 }
        totalReadingMinutes: { type: integer, format: int64, minimum: 0 }
        measuredUntil: { type: string, format: date }
