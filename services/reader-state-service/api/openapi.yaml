openapi: 3.0.3
info:
  title: reader-state-service
  version: 0.1.0
  description: Estado privado de leitura e projeção versionada da planta.
servers:
  - url: https://bookrush.jteodoro.tec.br
paths:
  /api/v1/reader/sessions:
    post:
      operationId: startReaderSession
      summary: Iniciar uma sessão de leitura
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-BookRush-Recommendation-Item, in: header, schema: { type: string, format: uuid } }
        - { name: X-BookRush-Impression, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { description: Sessão criada }
        '401': { description: Token ausente ou inválido }
  /api/v1/reader/sessions/{id}/end:
    post:
      operationId: endReaderSession
      summary: Encerrar uma sessão de leitura
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activeSeconds]
              properties:
                activeSeconds: { type: integer, minimum: 0 }
      responses:
        '200': { description: Sessão encerrada e READ_SESSION publicado }
        '401': { description: Token ausente ou inválido }
        '404': { description: Sessão inexistente ou não pertencente ao leitor }
  /api/v1/reader/books/{bookId}/progress:
    put:
      operationId: updateReaderProgress
      summary: Atualizar progresso e publicar outcomes de leitura
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-BookRush-Recommendation-Item, in: header, schema: { type: string, format: uuid } }
        - { name: X-BookRush-Impression, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionCodepoint, percent]
              properties:
                positionCodepoint: { type: integer, minimum: 0 }
                percent: { type: number, minimum: 0, maximum: 100 }
      responses:
        '200': { description: Progresso persistido }
        '401': { description: Token ausente ou inválido }
  /api/v1/reader/plant:
    get:
      operationId: getReaderPlant
      summary: Obter a projeção de crescimento do leitor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projeção persistida e recalculada para o subject autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantState'
        '401':
          description: Token ausente ou inválido.
    post:
      operationId: recordPlantReadingTime
      summary: Registrar um intervalo de leitura visível
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, activeSeconds, endedAt]
              properties:
                eventId: { type: string, format: uuid }
                activeSeconds: { type: integer, minimum: 1, maximum: 60 }
                endedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Estado atualizado; repetições do mesmo eventId são idempotentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantState' }
        '400': { description: Intervalo inválido ou fora da janela permitida. }
        '401': { description: Token ausente ou inválido. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PlantState:
      type: object
      required: [formulaVersion, stage, sad, streakDays, todaySeconds, goalSeconds, goalReached, totalReadingMinutes, measuredUntil]
      properties:
        formulaVersion: { type: string, example: daily-reading-v2 }
        stage: { type: integer, minimum: 0, maximum: 5 }
        sad: { type: boolean }
        todaySeconds: { type: integer, minimum: 0 }
        goalSeconds: { type: integer, example: 900 }
        goalReached: { type: boolean }
        streakDays: { type: integer, minimum: 0 }
        totalReadingMinutes: { type: integer, format: int64, minimum: 0 }
        measuredUntil: { type: string, format: date }
