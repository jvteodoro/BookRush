server:
  port: ${SERVER_PORT:8099}
logging:
  level:
    org.springframework.security.oauth2.server.resource: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG
spring:
  application:
    name: publisher-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
  flyway:
    schemas: publisher
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BOOKRUSH_SECURITY_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
          jwk-set-uri: ${BOOKRUSH_SECURITY_JWK_SET_URI:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
management:
  endpoints.web.exposure.include: health,info,metrics
bookrush:
  security:
    audience: ${BOOKRUSH_SECURITY_AUDIENCE:bookrush-ingestion}
  cors:
    allowed-origins: ${BOOKRUSH_CORS_ALLOWED_ORIGINS:https://bookrush.jteodoro.tec.br,http://localhost:18080}
publisher:
  ingestion-callback-token: ${PUBLISHER_INGESTION_CALLBACK_TOKEN:}
  ingestion:
    url: ${PUBLISHER_INGESTION_URL:http://book-ingestion-service:8090}
    token: ${PUBLISHER_INGESTION_CALLBACK_TOKEN:}
  behavior-url: ${PUBLISHER_BEHAVIOR_URL:http://behavior-service:8097}
  storage:
    enabled: ${PUBLISHER_STORAGE_ENABLED:false}
    endpoint: ${STORAGE_ENDPOINT:http://seaweedfs:8333}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:18333}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET_STAGING:books-staging}
    ttl-seconds: ${STORAGE_URL_TTL_SECONDS:900}
