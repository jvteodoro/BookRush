server:
  port: ${SERVER_PORT:8099}
spring:
  config:
    import: optional:classpath:bookrush-observability.yml
  application:
    name: publisher-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
  flyway:
    schemas: publisher
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BOOKRUSH_SECURITY_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
          jwk-set-uri: ${BOOKRUSH_SECURITY_JWK_SET_URI:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
bookrush:
  security:
    audience: ${BOOKRUSH_SECURITY_AUDIENCE:bookrush-ingestion}
  cors:
    allowed-origins: ${BOOKRUSH_CORS_ALLOWED_ORIGINS:https://bookrush.jteodoro.tec.br,http://localhost:18080}
publisher:
  identity:
    product-issuer: ${BOOKRUSH_PRODUCT_SECURITY_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush}
    editorial-issuer: ${BOOKRUSH_ADMIN_SECURITY_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
    author-clients: ${PUBLISHER_AUTHOR_CLIENTS:bookrush-web,bookrush-mobile}
  metrics:
    token-uri: ${PUBLISHER_METRICS_TOKEN_URI:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/token}
    client-id: ${PUBLISHER_METRICS_CLIENT_ID:bookrush-publisher-metrics-s2s}
    client-secret: ${PUBLISHER_METRICS_CLIENT_SECRET:}
  ingestion-callback-token: ${PUBLISHER_INGESTION_CALLBACK_TOKEN:}
  ingestion:
    url: ${PUBLISHER_INGESTION_URL:http://book-ingestion-service:8090}
    token: ${PUBLISHER_INGESTION_CALLBACK_TOKEN:}
  behavior-url: ${PUBLISHER_BEHAVIOR_URL:http://behavior-service:8097}
  behavior-metrics:
    token-uri: ${PUBLISHER_BEHAVIOR_METRICS_TOKEN_URI:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/token}
    client-id: ${PUBLISHER_BEHAVIOR_METRICS_CLIENT_ID:bookrush-publisher-behavior-s2s}
    client-secret: ${PUBLISHER_BEHAVIOR_METRICS_CLIENT_SECRET:}
    scope: ${PUBLISHER_BEHAVIOR_METRICS_SCOPE:bookrush.publisher.metrics.read}
    audience: ${PUBLISHER_BEHAVIOR_METRICS_AUDIENCE:bookrush-behavior}
  storage:
    enabled: ${PUBLISHER_STORAGE_ENABLED:false}
    endpoint: ${STORAGE_ENDPOINT:http://seaweedfs:8333}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:18333}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET_STAGING:books-staging}
    ttl-seconds: ${STORAGE_URL_TTL_SECONDS:900}
