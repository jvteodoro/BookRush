server:
  port: ${SERVER_PORT:8099}
spring:
  application:
    name: publisher-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
  flyway:
    schemas: publisher
management:
  endpoints.web.exposure.include: health,info,metrics
publisher:
  ingestion-callback-token: ${PUBLISHER_INGESTION_CALLBACK_TOKEN:}
  behavior-url: ${PUBLISHER_BEHAVIOR_URL:http://behavior-service:8097}
  storage:
    enabled: ${PUBLISHER_STORAGE_ENABLED:false}
    endpoint: ${STORAGE_ENDPOINT:http://seaweedfs:8333}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:18333}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET_STAGING:books-staging}
    ttl-seconds: ${STORAGE_URL_TTL_SECONDS:900}
