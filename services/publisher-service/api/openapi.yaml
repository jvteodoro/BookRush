openapi: 3.0.3
info:
  title: publisher-service
  version: 0.1.0
paths:
  /api/internal/v1/publisher/submissions/{submissionId}/catalog-link:
    post:
      summary: Link a submission after canonical ingestion
      description: Internal idempotent callback; protected by the ingestion callback credential.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-BookRush-Ingestion-Token
          in: header
          required: true
          schema: {type: string, format: password}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catalogBookId]
              properties:
                catalogBookId: {type: string, format: uuid}
                ingestionJobId: {type: string, format: uuid}
                sourceCode: {type: string}
                sourceExternalId: {type: string}
      responses:
        '200': {description: Link applied}
        '401': {description: Invalid callback credential}
        '409': {description: Conflicting existing link}
  /api/v1/publisher/submissions/{id}/metrics:
    get:
      summary: Daily statistics for the authenticated publisher's own published book
      description: Requires platform bearer (issuer bookrush-platform, audience bookrush-ingestion). Ownership is verified against submission and published_work. No reader identities are exposed. A draft's user-supplied catalog ID does not grant metrics access.
      security: [{publisherBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365, default: 30}}
      responses:
        '200':
          description: Published-book daily metrics, or NOT_LINKED when no verified published work exists. Empty AVAILABLE items means no activity in the requested window.
          content:
            application/json:
              schema:
                type: object
                required: [submissionId, status, days, items]
                properties:
                  submissionId: {type: string, format: uuid}
                  catalogBookId: {type: string, format: uuid}
                  status: {type: string, enum: [AVAILABLE, NOT_LINKED]}
                  days: {type: integer, minimum: 1, maximum: 365}
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyMetrics'
        '400': {description: Invalid days or UUID}
        '401': {description: Missing or invalid bearer}
        '404': {description: Submission absent or owned by another publisher}
        '503': {description: Metrics service or dedicated credential unavailable; never reported as zero activity}
components:
  securitySchemes:
    publisherBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    DailyMetrics:
      type: object
      required: [day, impressions, opens, reads, likes, shares, comments]
      properties:
        day: {type: string, format: date}
        impressions: {type: integer, format: int64, minimum: 0}
        opens: {type: integer, format: int64, minimum: 0}
        reads: {type: integer, format: int64, minimum: 0}
        likes: {type: integer, format: int64, minimum: 0}
        shares: {type: integer, format: int64, minimum: 0}
        comments: {type: integer, format: int64, minimum: 0}
