server:
  port: 8080
  shutdown: graceful
  # Use the original HTTPS scheme from Nginx/Traefik for generated links.
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    url: /v3/api-docs
bookrush:
  openapi:
    server-url: ${BOOKRUSH_PUBLIC_URL:https://bookrush.jteodoro.tec.br}
  observability:
    correlation:
      enabled: ${BOOKRUSH_CORRELATION_ENABLED:true}
  security:
    enabled: ${CATALOG_OIDC_ENABLED:false}
    issuer: ${CATALOG_OIDC_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
    jwk-set-uri: ${CATALOG_OIDC_JWK_SET_URI:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
    audience: ${CATALOG_OIDC_AUDIENCE:bookrush-catalog-admin}
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keep decoder configuration under Spring's canonical namespace;
          # catalog.security.oidc remains the authorization policy metadata.
          issuer-uri: ${CATALOG_OIDC_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
          jwk-set-uri: ${CATALOG_OIDC_JWK_SET_URI:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
      file-size-threshold: 0
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    default-schema: catalog
    schemas: catalog
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    properties:
      hibernate:
        default_schema: catalog
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
storage:
  enabled: ${STORAGE_ENABLED:false}
  endpoint: ${STORAGE_ENDPOINT:}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  path-style: ${STORAGE_PATH_STYLE:true}
  url-ttl-seconds: ${STORAGE_URL_TTL_SECONDS:300}
  max-upload-bytes: ${STORAGE_MAX_UPLOAD_BYTES:104857600}
  timeout: ${STORAGE_TIMEOUT:30s}
  admin-token: ${ASSET_ADMIN_TOKEN:}
  buckets:
    source: ${STORAGE_BUCKET_SOURCE:books-source}
    public-bucket: ${STORAGE_BUCKET_PUBLIC:books-public}
    processing: ${STORAGE_BUCKET_PROCESSING:books-processing}
    ml: ${STORAGE_BUCKET_ML:books-ml}
    raw: ${STORAGE_BUCKET_RAW:books-raw}
canonical:
  service:
    token: ${CANONICAL_SERVICE_TOKEN:}
catalog:
  security:
    oidc:
      enabled: ${CATALOG_OIDC_ENABLED:false}
      issuer: ${CATALOG_OIDC_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
      audience: ${CATALOG_OIDC_AUDIENCE:bookrush-catalog-admin}
      legacy-static-enabled: ${CATALOG_SECURITY_LEGACY_STATIC_ENABLED:false}
