server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    default-schema: catalog
    schemas: catalog
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    properties:
      hibernate:
        default_schema: catalog
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
