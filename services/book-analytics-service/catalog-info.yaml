apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: book-analytics-service
  description: Analytics determinístico e semântico ligado a versões textuais exatas.
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: jvteodoro/BookRush
spec:
  type: service
  lifecycle: experimental
  owner: group:default/book-platform
  system: book-catalog
  dependsOn:
    - component:default/catalog-service
    - resource:default/books-postgres
    - resource:default/books-object-storage
  providesApis:
    - book-analytics-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: book-analytics-api
  description: Consultas internas de analytics e excerpts.
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/book-platform
  system: book-catalog
  definition:
    $text: ./api/openapi.yaml
