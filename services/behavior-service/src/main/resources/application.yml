server:
  port: ${SERVER_PORT:8097}
spring:
  application:
    name: behavior-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
  flyway:
    enabled: true
    schemas: behavior
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
bookrush:
  security:
    enabled: ${BOOKRUSH_SECURITY_ENABLED:false}
    issuer: ${BOOKRUSH_SECURITY_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush}
    jwk-set-uri: ${BOOKRUSH_SECURITY_JWK_SET_URI:http://keycloak:8080/realms/bookrush/protocol/openid-connect/certs}
    audience: ${BOOKRUSH_SECURITY_AUDIENCE:account}
    s2s-issuer: ${BOOKRUSH_S2S_SECURITY_ISSUER:https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
    s2s-jwk-set-uri: ${BOOKRUSH_S2S_SECURITY_JWK_SET_URI:http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
    s2s-audience: ${BOOKRUSH_S2S_SECURITY_AUDIENCE:bookrush-behavior}
    s2s-scope: ${BOOKRUSH_S2S_SECURITY_SCOPE:bookrush.behavior.read}
  cors:
    allowed-origins: ${BOOKRUSH_CORS_ALLOWED_ORIGINS:https://bookrush.jteodoro.tec.br,http://localhost:18080}
  behavior:
    maintenance-enabled: ${BEHAVIOR_MAINTENANCE_ENABLED:true}
    retention-days: ${BEHAVIOR_RETENTION_DAYS:365}
    maintenance-delay-ms: ${BEHAVIOR_MAINTENANCE_DELAY_MS:300000}
    data-quality-delay-ms: ${BEHAVIOR_DATA_QUALITY_DELAY_MS:300000}
    outbox-sink-url: ${BEHAVIOR_OUTBOX_SINK_URL:}
    outbox-sink-token: ${BEHAVIOR_OUTBOX_SINK_TOKEN:}
    outbox-delay-ms: ${BEHAVIOR_OUTBOX_DELAY_MS:5000}
    outbox-batch-size: ${BEHAVIOR_OUTBOX_BATCH_SIZE:100}
