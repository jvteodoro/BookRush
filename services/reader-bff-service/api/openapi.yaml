openapi: 3.0.3
info:
  title: reader-bff-service
  version: 0.1.0
paths:
  /api/v1/reader/sessions:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-BookRush-Recommendation-Item, in: header, schema: { type: string, format: uuid } }
        - { name: X-BookRush-Impression, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json: { schema: { type: object, properties: { bookId: { type: string, format: uuid, nullable: true } } } }
      responses:
        '200': { description: Reading session started }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/sessions/{id}/end:
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [activeSeconds], properties: { activeSeconds: { type: integer, minimum: 0 } } } }
      responses:
        '200': { description: Reading session ended }
        '401': { description: Authentication required }
        '404': { description: Session not found }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/books/seen:
    get:
      summary: Read private seen status for a bounded batch of books
      description: A book is seen after its content loads in the reader, not after a feed impression. Product realm, audience account, no extra scope. Only the authenticated subject is queried; the result is independent of the recent-history limit.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Seen entries from the requested batch; unseen books are absent
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [bookId, firstSeenAt, lastSeenAt]
                      properties:
                        bookId: {type: string, format: uuid}
                        firstSeenAt: {type: string, format: date-time}
                        lastSeenAt: {type: string, format: date-time}
        '400': {description: Missing, malformed or oversized book ID batch}
        '401': {description: Missing, invalid, expired or wrong-audience product token}
        '403': {description: Disallowed CORS origin}
        '502': {description: Reader state service unavailable at the gateway}

  /api/v1/reader/feed:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Composed analytics-ready recommendation feed; when analytics ranking is enabled, books without an eligible score and non-empty excerpt are omitted }
        '401': { description: Authentication required }
        '502': { description: Recommendation service unavailable }
  /api/v1/reader/recommendations:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Recommendation feed }
        '401': { description: Authentication required }
        '502': { description: Recommendation service unavailable }
  /api/v1/reader/library:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Saved books for the authenticated reader, including books outside the current feed }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/library/{bookId}:
    put:
      description: Saves the book identified by the path for the authenticated reader. No request body is required.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Library entry saved for the authenticated reader; repeated saves do not create duplicates }
        '400': { description: Invalid book UUID }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
    delete:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Library entry removed for the authenticated reader; repeated removals succeed }
        '400': { description: Invalid book UUID }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/recent:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Recent books }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/streak:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reading streak }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/books/{bookId}/progress:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Book progress }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
    put:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Progress updated }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/books/{bookId}/bookmarks:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Book bookmarks }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Bookmark saved }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/books/{bookId}/opened:
    post:
      summary: Record reading after content loads successfully
      description: Atomically records recent history and private seen status; a feed impression or failed load does not count. Reopening preserves the first-seen timestamp and does not mark completion.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Successfully loaded opening and private seen status persisted }
        '401': { description: Authentication required }
        '502': { description: Reader state service unavailable }
  /api/v1/reader/books/{bookId}:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Reader book content metadata }
        '401': { description: Authentication required }
        '502': { description: Book content service unavailable }
  /api/v1/reader/books/{bookId}/publication.json:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: EPUB publication manifest }
        '401': { description: Authentication required }
        '502': { description: Book content service unavailable }
  /api/v1/reader/books/{bookId}/chapters:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Book chapter structure }
        '401': { description: Authentication required }
        '502': { description: Book content service unavailable }
  /api/v1/reader/books/{bookId}/chapters/{chapterId}/content:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chapterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Chapter content }
        '401': { description: Authentication required }
        '502': { description: Book content service unavailable }
  /api/v1/reader/books/{bookId}/resources/{resource}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: resource, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: EPUB resource }
        '401': { description: Authentication required }
        '502': { description: Book content service unavailable }
  /api/v1/reader/recommendations/impressions/{impressionId}/viewable:
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: impressionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Impression recorded }
        '401': { description: Authentication required }
        '502': { description: Recommendation service unavailable }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
