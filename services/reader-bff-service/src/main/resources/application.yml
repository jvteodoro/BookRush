server:
  port: ${SERVER_PORT:8101}
spring:
  config:
    import: optional:classpath:bookrush-observability.yml
  application:
    name: reader-bff-service
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
bookrush:
  security:
    enabled: ${BOOKRUSH_SECURITY_ENABLED:false}
  cors:
    allowed-origins: ${BOOKRUSH_CORS_ALLOWED_ORIGINS:https://bookrush.jteodoro.tec.br,http://localhost:18080}
  recommendation-url: ${RECOMMENDATION_URL:http://recommendation-service:8098}
  reader-state-url: ${READER_STATE_URL:http://reader-state-service:8094}
  content-url: ${BOOK_CONTENT_URL:http://book-content-service:8093}
  supervision:
    enabled: ${READER_BFF_SUPERVISION_ENABLED:false}
    token-uri: ${READER_BFF_SUPERVISION_TOKEN_URI:}
    client-secret: ${READER_BFF_SUPERVISION_CLIENT_SECRET:}
    allow-insecure-http: ${READER_BFF_SUPERVISION_ALLOW_INSECURE_HTTP:false}
    comments-enabled: ${READER_BFF_SUPERVISED_COMMENTS_ENABLED:false}
    social-url: ${READER_BFF_SUPERVISION_SOCIAL_URL:http://social-service:8096}
  session:
    enabled: ${READER_BFF_SESSION_ENABLED:false}
    family-url: ${READER_BFF_SESSION_FAMILY_URL:}
    token-url: ${READER_BFF_SESSION_TOKEN_URL:}
    jwks: ${READER_BFF_SESSION_JWKS:}
    workload-issuer: ${READER_BFF_SESSION_WORKLOAD_ISSUER:}
    secret: ${READER_BFF_SESSION_CLIENT_SECRET:}
    allow-insecure-http: ${READER_BFF_SESSION_ALLOW_INSECURE_HTTP:false}
