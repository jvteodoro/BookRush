openapi: 3.0.3
info:
  title: BookRush Recommendation API
  version: 1.0.0
paths:
  /api/v1/recommendations/feed:
    get:
      summary: Generate an authenticated heuristic feed
      security: [{bearerAuth: []}]
      parameters:
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Feed with request, impression and optional analytics excerpt lineage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '401': {description: Authentication required}
  /api/v1/recommendations/impressions/{impressionId}/viewable:
    post:
      summary: Mark an owned impression as viewable
      security: [{bearerAuth: []}]
      parameters:
        - {name: impressionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Impression marked viewable}
        '401': {description: Authentication required}
        '404': {description: Impression is not owned by the caller}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    FeedResponse:
      type: object
      required: [requestId, modelVersion, items]
      properties:
        requestId: {type: string, format: uuid}
        modelVersion: {type: string}
        items:
          type: array
          items:
            type: object
            required: [book, recommendationRequestId, impressionId, modelVersion, rank]
            properties:
              book: {type: object}
              recommendationRequestId: {type: string, format: uuid}
              impressionId: {type: string, format: uuid}
              modelVersion: {type: string}
              rank: {type: integer}
              excerpt:
                $ref: '#/components/schemas/FeedExcerpt'
    FeedExcerpt:
      type: object
      required: [id, text, sourceAssetVersionId, textSha256, startCodepoint, endCodepoint, generationMethod, generatorVersion]
      properties:
        id: {type: string, format: uuid}
        text: {type: string}
        sourceAssetVersionId: {type: string, format: uuid}
        textSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        startCodepoint: {type: integer, minimum: 0}
        endCodepoint: {type: integer, exclusiveMinimum: 0}
        generationMethod: {type: string}
        generatorVersion: {type: string}
        rank:
          type: object
          nullable: true
          properties:
            version: {type: string}
            score: {type: number, nullable: true}
