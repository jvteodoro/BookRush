server:
  port: ${SERVER_PORT:8098}
spring:
  application:
    name: recommendation-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookrush}
    username: ${DB_USERNAME:bookrush}
    password: ${DB_PASSWORD:bookrush}
  flyway:
    enabled: true
    schemas: recommendation
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
bookrush:
  security:
    enabled: ${BOOKRUSH_SECURITY_ENABLED:false}
  catalog-url: ${CATALOG_URL:http://catalog-service:8080}
