user nginx nginx;
worker_processes 1;

error_log /var/log/nginx/error_log info;

events {
	worker_connections 1024;
	use epoll;
}

http {
# BookRush virtual hosts are maintained as independent files under
# /etc/nginx/conf.d/bookrush-*.conf.
include /etc/nginx/conf.d/bookrush-*.conf;

	include /etc/nginx/mime.types.nginx;
	types_hash_max_size 4096;
	default_type application/octet-stream;

	  # Increase the maximum size of the hash table
  	proxy_headers_hash_max_size 1024;

    # Increase the bucket size of the hash table
	proxy_headers_hash_bucket_size 128;

	log_format main
		'$remote_addr - $remote_user [$time_local] '
		'"$request" $status $bytes_sent '
		'"$http_referer" "$http_user_agent" '
		'"$gzip_ratio"';

	client_header_timeout 10m;
	client_body_timeout 10m;
	send_timeout 10m;

	connection_pool_size 256;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 2k;
	request_pool_size 4k;

	gzip off;

	output_buffers 1 32k;
	postpone_output 1460;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;

	keepalive_timeout 75 20;

	ignore_invalid_headers on;

	index index.html;

	server {
		listen 126.0.0.1;
		server_name localhost;

		access_log /var/log/nginx/localhost.access_log main;
		error_log /var/log/nginx/localhost.error_log info;

		root /var/www/localhost/htdocs;
	}
	server {
		listen 80;
		server_name jteodoro.tec.br;
		root /var/www/jteodoro.tec.br;
		location / {
			index index.html;
		}
	}

	server {
		listen 80;
		return 301 https://$host$request_uri;
	}
	server {

		server_name vicamorim.jteodoro.tec.br;

		location / {
			#			proxy_pass http://127.0.0.1:10017;
			proxy_pass http://127.0.0.1:8501;
			        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Opcional, melhora compatibilidade com Streamlit
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
		}
		

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vicamorim.jteodoro.tec.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vicamorim.jteodoro.tec.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

	server {
		server_name web.glip.jteodoro.tec.br;
		client_max_body_size 100M;
		
    location / {
        proxy_pass http://127.0.0.1:9000; # porta exposta do container
        proxy_http_version 1.1;

        # Headers ESSENCIAIS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets / keep-alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffers (evita erro no admin)
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;

        # Timeouts (admin pesado)
        proxy_read_timeout 300;
        proxy_send_timeout 300;
	}
	

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/web.glip.jteodoro.tec.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/web.glip.jteodoro.tec.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
	server {
		server_name pro.jovens.jteodoro.tec.br;
		
		location / {
			proxy_pass http://127.0.0.1:16000;
			include proxy_params;
		}
	

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pro.jovens.jteodoro.tec.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pro.jovens.jteodoro.tec.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
