map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
	if ($scheme = "http"){
		return 301 https://$host$request_uri;
	}
	if ($http_x_forwarded_proto = "http"){
		return 301 https://$host$request_uri;
	}


	proxy_buffering off;
	proxy_request_buffering off;

	client_max_body_size 10G;
	client_body_buffer_size 512k;
	# http3_stream_buffer_size 512k; # uncomment to enable HTTP/3 / QUIC - supported on nginx v1.25.0+
	proxy_read_timeout 86400s;

		server_name iasdembu.jteodoro.tec.br;
		location / {
			proxy_pass http://127.0.0.1:10017;

			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Port $server_port;
			proxy_set_header X-Forwarded-Scheme $scheme;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Real-IP $remote_addr;
			#proxy_set_header Host $host;
			proxy_set_header Early-Data $ssl_early_data;

		        # Websocket
			proxy_http_version 1.1;
			#proxy_set_header Upgrade $http_upgrade;
			#proxy_set_header Connection $connection_upgrade;

			include  proxy_params;
		}
	



    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/iasdembu.jteodoro.tec.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/iasdembu.jteodoro.tec.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


