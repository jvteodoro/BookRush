server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }
  root /usr/share/nginx/html;
  index index.html;
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
  location /admin/ {
    rewrite ^/admin/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://keycloak-bookrush.jteodoro.tec.br https://bookrush.jteodoro.tec.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://keycloak-bookrush.jteodoro.tec.br" always;
}
