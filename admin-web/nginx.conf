server {
    listen 80;
    server_name _;
    include /etc/nginx/bookrush-security-headers.conf;

    # Docker's embedded DNS is queried when a proxied request arrives. Using a
    # variable prevents nginx from exiting when admin-service is being
    # recreated at the same time as this container during a rolling deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_service http://admin-service:8100;
    set $publisher_service http://publisher-service:8099;

    location = /healthz {
        access_log off;
        include /etc/nginx/bookrush-security-headers.conf;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }
  root /usr/share/nginx/html;
  index index.html;
  location = /index.html {
    include /etc/nginx/bookrush-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
  # Keep the browser on the same origin while forwarding the protected
  # administrative facade to the service that owns it. This also makes the
  # dedicated admin-web hostname behave like the /admin route on the gateway.
  location /api/v1/publisher/ {
    proxy_pass $publisher_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /api/v1/admin/ {
    proxy_pass $admin_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  # Reporting keeps its versioned facade under /api/admin while the legacy
  # administrative commands remain under /api/v1/admin. Both namespaces must
  # reach the same protected admin-service when the web app is run standalone.
  location /api/admin/ {
    proxy_pass $admin_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location /admin/ {
    rewrite ^/admin/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
  location / { try_files $uri $uri/ /index.html; }
}
