server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
compactor:
  compaction:
    block_retention: 168h
metrics_generator:
  registry:
    external_labels:
      source: tempo
      environment: production
  storage:
    path: /var/tempo/generator/wal
  processor:
    - service-graphs
    - span-metrics
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
