name: ${OBSERVABILITY_COMPOSE_NAME:-bookrush-observability}

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/bookrush-observability/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${OBS_PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus_data:/prometheus
      - observability_config:/etc/bookrush-observability:ro
    networks: [observability, bookrush]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${OBS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${OBS_GRAFANA_ADMIN_PASSWORD:?Set OBS_GRAFANA_ADMIN_PASSWORD in the protected environment}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${OBS_GRAFANA_OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${OBS_GRAFANA_OIDC_CLIENT_ID:-bookrush-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${OBS_GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: ${OBS_GRAFANA_OIDC_EMAIL_ATTRIBUTE_PATH:-email || preferred_username}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${OBS_GRAFANA_OIDC_AUTH_URL:-https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform/protocol/openid-connect/auth}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${OBS_GRAFANA_OIDC_TOKEN_URL:-https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform/protocol/openid-connect/token}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${OBS_GRAFANA_OIDC_API_URL:-https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform/protocol/openid-connect/userinfo}
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: ${OBS_GRAFANA_OIDC_ROLE_ATTRIBUTE_PATH:-contains(groups[*], 'platform-admins') && 'Admin' || (contains(groups[*], 'platform-operators') || contains(groups[*], 'operators')) && 'Editor' || 'Viewer'}
      GF_SERVER_ROOT_URL: ${OBS_GRAFANA_ROOT_URL:-http://127.0.0.1:13000}
      GF_METRICS_ENABLED: "true"
      GF_PATHS_PROVISIONING: /etc/bookrush-observability/grafana/provisioning
    ports:
      - "127.0.0.1:${OBS_GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - observability_config:/etc/bookrush-observability:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks: [observability, bookrush]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/bookrush-observability/loki/config.yaml"]
    volumes:
      - loki_data:/loki
      - observability_config:/etc/bookrush-observability:ro
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/bookrush-observability/tempo/config.yaml"]
    volumes:
      - tempo_data:/var/tempo
      - observability_config:/etc/bookrush-observability:ro
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  alloy:
    image: grafana/alloy:v1.4.2
    restart: unless-stopped
    command: ["run", "/etc/bookrush-observability/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - observability_config:/etc/bookrush-observability:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks: [observability, bookrush]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${OBS_POSTGRES_EXPORTER_DATA_SOURCE_NAME:?Set OBS_POSTGRES_EXPORTER_DATA_SOURCE_NAME in the protected environment}
    networks: [observability, bookrush]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${OBS_REDIS_ADDR:-redis://redis:6379}
    networks: [observability, bookrush]
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 15s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK_NAME:-bookrush_observability}
  bookrush:
    name: ${BOOKRUSH_NETWORK_NAME:-bookrush_bookrush}
    external: true

volumes:
  observability_config:
    name: ${OBS_CONFIG_VOLUME:-bookrush-observability-config}
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
