groups:
  - name: bookrush-http
    interval: 30s
    rules:
      - record: bookrush:http_requests:rate5m
        expr: sum by (job, instance) (rate(http_server_requests_seconds_count[5m]))
      - record: bookrush:http_server_errors:rate5m
        expr: sum by (job, instance) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
      - record: bookrush:http_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (job, instance, le) (rate(http_server_requests_seconds_bucket[5m])))
