groups:
  - name: bookrush-availability
    rules:
      - alert: BookRushTargetDown
        expr: up{job=~"bookrush-java|postgres-exporter|redis-exporter|cadvisor|node-exporter"} == 0
        for: 2m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "BookRush observability target is down"
          description: "Target {{ $labels.job }} at {{ $labels.instance }} has been down for more than two minutes."
          runbook: "docs/operations/observability.md#target-down"

      - alert: BookRushHttpServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.01
        for: 10m
        labels:
          severity: warning
          owner: service
        annotations:
          summary: "BookRush HTTP 5xx rate is elevated"
          description: "The aggregate 5xx ratio is above 1% for ten minutes."
          runbook: "docs/operations/observability.md#http-errors"
