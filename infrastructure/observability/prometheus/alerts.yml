groups:
  - name: bookrush-availability
    rules:
      - alert: BookRushTargetDown
        expr: up{job=~"bookrush-java|postgres-exporter|redis-exporter|cadvisor|node-exporter"} == 0
        for: 2m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "BookRush observability target is down"
          description: "Target {{ $labels.job }} at {{ $labels.instance }} has been down for more than two minutes."
          runbook: "docs/operations/observability.md#target-down"

      - alert: BookRushHttpServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.01
        for: 10m
        labels:
          severity: warning
          owner: service
        annotations:
          summary: "BookRush HTTP 5xx rate is elevated"
          description: "The aggregate 5xx ratio is above 1% for ten minutes."
          runbook: "docs/operations/observability.md#http-errors"

      - alert: BookRushHttpLatencyP95High
        expr: bookrush:http_latency:p95_5m > 2.5
        for: 15m
        labels:
          severity: warning
          owner: service
        annotations:
          summary: "BookRush HTTP p95 latency is elevated"
          description: "Aggregated p95 latency is above the initial 2.5 second threshold for fifteen minutes; calibrate against traffic volume and the service dashboard."
          runbook: "docs/operations/observability.md#http-errors"

  - name: bookrush-data-freshness
    rules:
      - alert: BookRushBehaviorProjectionStale
        expr: bookrush_behavior_data_quality_projection_age_seconds > 900
        for: 10m
        labels:
          severity: warning
          owner: behavior
        annotations:
          summary: "Behavior projection freshness is outside the initial threshold"
          description: "The behavior-owned projection reports an age above 15 minutes; inspect the projection and outbox runbook."
          runbook: "docs/operations/observability.md#stuck-worker-e-freshness"
