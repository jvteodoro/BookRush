services:
  reverse-proxy:
    environment:
      BOOKRUSH_TRAEFIK_DYNAMIC_CONFIG: ${BOOKRUSH_TRAEFIK_DYNAMIC_CONFIG:?Configuração de rotas da revisão ausente}
    # The daemon sees the stable host checkout, not the Jenkins workspace.
    # Materialize the selected revision inside the container instead of using
    # the stale host bind mount. Preserve all other proxy command arguments.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${BOOKRUSH_TRAEFIK_DYNAMIC_CONFIG:?Routing configuration missing}"
        printf '%s\n' "$$BOOKRUSH_TRAEFIK_DYNAMIC_CONFIG" > /tmp/bookrush-traefik-dynamic.yaml
        for argument in "$$@"; do
          shift
          case "$$argument" in
            --providers.file.filename=*) ;;
            *) set -- "$$@" "$$argument" ;;
          esac
        done
        exec /entrypoint.sh "$$@" --providers.file.filename=/tmp/bookrush-traefik-dynamic.yaml
      - bookrush-gateway
  behavior-service:
    image: ${BEHAVIOR_IMAGE:?Imagem behavior ausente}
    environment:
      BOOKRUSH_SECURITY_ENABLED: ${BOOKRUSH_SECURITY_ENABLED:-true}
      BOOKRUSH_SECURITY_ISSUER: ${BOOKRUSH_PRODUCT_SECURITY_ISSUER:-https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush}
      BOOKRUSH_SECURITY_JWK_SET_URI: ${BOOKRUSH_PRODUCT_SECURITY_JWK_SET_URI:-http://keycloak:8080/realms/bookrush/protocol/openid-connect/certs}
      BOOKRUSH_SECURITY_AUDIENCE: ${BOOKRUSH_PRODUCT_SECURITY_AUDIENCE:-account}
      BOOKRUSH_S2S_SECURITY_ISSUER: ${BOOKRUSH_ADMIN_SECURITY_ISSUER:-https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
      BOOKRUSH_S2S_SECURITY_JWK_SET_URI: ${BOOKRUSH_ADMIN_SECURITY_JWK_SET_URI:-http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
      BOOKRUSH_S2S_SECURITY_AUDIENCE: ${BOOKRUSH_S2S_SECURITY_AUDIENCE:-bookrush-behavior}
      BOOKRUSH_S2S_SECURITY_SCOPE: ${BOOKRUSH_S2S_SECURITY_SCOPE:-bookrush.behavior.read}
  catalog-service:
    image: ${BACKEND_IMAGE:?Imagem backend ausente}
  frontend:
    image: ${FRONTEND_IMAGE:?Imagem frontend ausente}
  book-ingestion-service:
    image: ${INGESTION_IMAGE:?Imagem ingestion ausente}
  book-analytics-service:
    image: ${ANALYTICS_IMAGE:?Imagem analytics ausente}
  recommendation-service:
    image: ${RECOMMENDATION_IMAGE:?Imagem recommendation ausente}
    environment:
      FEED_PERSONALIZED_MODE: ${FEED_PERSONALIZED_MODE:-ON}
      FEED_PERSONALIZED_MIN_COVERAGE: ${FEED_PERSONALIZED_MIN_COVERAGE:-0.5}
      FEED_PERSONALIZED_MIN_CONFIDENCE: ${FEED_PERSONALIZED_MIN_CONFIDENCE:-0.5}
      FEED_PERSONALIZED_BEHAVIOR_URL: ${FEED_PERSONALIZED_BEHAVIOR_URL:-http://behavior-service:8097}
      FEED_PERSONALIZED_BEHAVIOR_TOKEN_URI: ${FEED_PERSONALIZED_BEHAVIOR_TOKEN_URI:-http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/token}
      FEED_PERSONALIZED_BEHAVIOR_CLIENT_ID: ${FEED_PERSONALIZED_BEHAVIOR_CLIENT_ID:-bookrush-recommendation-behavior-s2s}
      FEED_PERSONALIZED_BEHAVIOR_CLIENT_SECRET: ${BEHAVIOR_S2S_CLIENT_SECRET:-}
      FEED_PERSONALIZED_BEHAVIOR_AUDIENCE: ${FEED_PERSONALIZED_BEHAVIOR_AUDIENCE:-bookrush-behavior}
      FEED_PERSONALIZED_BEHAVIOR_SCOPE: ${FEED_PERSONALIZED_BEHAVIOR_SCOPE:-bookrush.behavior.read}
      FEED_PERSONALIZED_BEHAVIOR_CACHE_TTL: ${FEED_PERSONALIZED_BEHAVIOR_CACHE_TTL:-2m}
      FEED_PERSONALIZED_BEHAVIOR_CONNECT_TIMEOUT: ${FEED_PERSONALIZED_BEHAVIOR_CONNECT_TIMEOUT:-250ms}
      FEED_PERSONALIZED_BEHAVIOR_READ_TIMEOUT: ${FEED_PERSONALIZED_BEHAVIOR_READ_TIMEOUT:-1s}
      FEED_PERSONALIZED_BEHAVIOR_MAX_SIGNALS: ${FEED_PERSONALIZED_BEHAVIOR_MAX_SIGNALS:-50}
  reader-bff-service:
    image: ${READER_BFF_IMAGE:?Imagem reader-bff ausente}
  book-analytics-runtime:
    image: ${ANALYTICS_RUNTIME_IMAGE:?Imagem analytics-runtime ausente}
  reader-state-service:
    image: ${READER_STATE_IMAGE:?Imagem reader-state ausente}
  reader-profile-service:
    image: ${READER_PROFILE_IMAGE:?Imagem reader-profile ausente}
  social-service:
    image: ${SOCIAL_IMAGE:?Imagem social ausente}
  admin-service:
    image: ${ADMIN_SERVICE_IMAGE:?Imagem admin-service ausente}
    environment:
      KEYCLOAK_ADMIN_TOKEN_URI: ${KEYCLOAK_ADMIN_TOKEN_URI:-http://keycloak:8080/realms/bookrush/protocol/openid-connect/token}
      KEYCLOAK_ADMIN_BASE: ${KEYCLOAK_ADMIN_BASE:-http://keycloak:8080/admin/realms/bookrush}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-bookrush-admin-service}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
  admin-web:
    image: ${ADMIN_WEB_IMAGE:?Imagem admin-web ausente}
