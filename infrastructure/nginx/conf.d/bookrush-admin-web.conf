# DNS must provide admin-web-bookrush.jteodoro.tec.br and Certbot must issue
# the certificate before this module is installed on the host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin-web-bookrush.jteodoro.tec.br;

    ssl_certificate /etc/letsencrypt/live/admin-web-bookrush.jteodoro.tec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-web-bookrush.jteodoro.tec.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin-web-bookrush.jteodoro.tec.br;
    return 301 https://$host$request_uri;
}
