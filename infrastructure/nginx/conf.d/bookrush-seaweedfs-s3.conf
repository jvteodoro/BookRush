# HTTPS is managed by Certbot. This host exposes only the S3 API; object
# authorization is provided by SeaweedFS presigned URLs.
server {
    listen 80;
    listen [::]:80;
    server_name seaweedfs-s3-bookrush.jteodoro.tec.br;
    client_max_body_size 100m;
    large_client_header_buffers 4 32k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seaweedfs-s3-bookrush.jteodoro.tec.br;

    ssl_certificate /etc/letsencrypt/live/seaweedfs-s3-bookrush.jteodoro.tec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seaweedfs-s3-bookrush.jteodoro.tec.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;
    large_client_header_buffers 4 32k;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}
