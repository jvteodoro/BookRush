map $http_upgrade $bookrush_jenkins_connection {
    default upgrade;
    "" close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jenkins-bookrush.jteodoro.tec.br;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/jenkins-bookrush.jteodoro.tec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins-bookrush.jteodoro.tec.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bookrush_jenkins_connection;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name jenkins-bookrush.jteodoro.tec.br;
    return 301 https://$host$request_uri;
}
