# pgAdmin is protected by both this Basic Auth layer and pgAdmin login.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin-bookrush.jteodoro.tec.br;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/admin-bookrush.jteodoro.tec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-bookrush.jteodoro.tec.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "BookRush administration";
    auth_basic_user_file /etc/nginx/.htpasswd-bookrush-admin;

    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin-bookrush.jteodoro.tec.br;
    return 301 https://$host$request_uri;
}

# Backward-compatible alias used by older documentation and DNS records.
server {
    listen 80;
    listen [::]:80;
    server_name admin.bookrush.jteodoro.tec.br;
    return 301 https://admin-bookrush.jteodoro.tec.br$request_uri;
}
