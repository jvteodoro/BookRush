# Keycloak public hostname. TLS is terminated by this host Nginx.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keycloak-bookrush.jteodoro.tec.br;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/keycloak-bookrush.jteodoro.tec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keycloak-bookrush.jteodoro.tec.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name keycloak-bookrush.jteodoro.tec.br;
    return 301 https://$host$request_uri;
}
