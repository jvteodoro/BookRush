http:
  routers:
    ingestion-docs:
      rule: PathPrefix(`/ingestion-docs`)
      entryPoints:
        - web
      priority: 120
      service: ingestion

    keycloak:
      rule: Host(`keycloak-bookrush.jteodoro.tec.br`)
      entryPoints:
        - web
      priority: 200
      service: keycloak

    seaweedfs-oauth:
      rule: Host(`seaweedfs-bookrush.jteodoro.tec.br`) && PathPrefix(`/oauth2`)
      entryPoints:
        - web
      priority: 400
      service: seaweedfs-oauth

    seaweedfs:
      rule: Host(`seaweedfs-bookrush.jteodoro.tec.br`)
      entryPoints:
        - web
      priority: 300
      service: seaweedfs-oauth

    catalog-docs:
      rule: PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`)
      entryPoints:
        - web
      priority: 110
      service: catalog

    catalog:
      rule: PathPrefix(`/api`)
      entryPoints:
        - web
      priority: 100
      service: catalog

    ingestion:
      rule: PathPrefix(`/ingestion`)
      entryPoints:
        - web
      priority: 100
      middlewares:
        - ingestion-strip
      service: ingestion

    analytics:
      rule: PathPrefix(`/analytics`)
      entryPoints:
        - web
      priority: 100
      middlewares:
        - analytics-strip
      service: analytics

    frontend:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      priority: 1
      service: frontend

  middlewares:
    ingestion-strip:
      stripPrefix:
        prefixes:
          - /ingestion
    analytics-strip:
      stripPrefix:
        prefixes:
          - /analytics


  services:
    catalog:
      loadBalancer:
        servers:
          - url: http://catalog-service:8080
    ingestion:
      loadBalancer:
        servers:
          - url: http://book-ingestion-service:8090
    analytics:
      loadBalancer:
        servers:
          - url: http://book-analytics-service:8091
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080
    seaweedfs-oauth:
      loadBalancer:
        servers:
          - url: http://seaweedfs-oidc:4180
