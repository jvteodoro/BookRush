http:
  routers:
    ingestion-docs:
      rule: PathPrefix(`/ingestion-docs`)
      entryPoints:
        - web
      priority: 120
      service: ingestion

    keycloak:
      rule: Host(`keycloak-bookrush.jteodoro.tec.br`)
      entryPoints:
        - web
      priority: 200
      service: keycloak

    catalog-docs:
      rule: PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`)
      entryPoints:
        - web
      priority: 110
      service: catalog

    catalog:
      rule: PathPrefix(`/api`)
      entryPoints:
        - web
      priority: 100
      service: catalog

    ingestion:
      rule: PathPrefix(`/ingestion`)
      entryPoints:
        - web
      priority: 100
      middlewares:
        - ingestion-strip
      service: ingestion

    frontend:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      priority: 1
      service: frontend

  middlewares:
    ingestion-strip:
      stripPrefix:
        prefixes:
          - /ingestion

  services:
    catalog:
      loadBalancer:
        servers:
          - url: http://catalog-service:8080
    ingestion:
      loadBalancer:
        servers:
          - url: http://book-ingestion-service:8090
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080
