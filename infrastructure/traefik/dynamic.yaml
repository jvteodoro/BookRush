http:
  routers:
    ingestion-docs:
      rule: PathPrefix(`/ingestion-docs`)
      entryPoints:
        - web
      priority: 120
      service: ingestion

    keycloak:
      rule: Host(`keycloak-bookrush.jteodoro.tec.br`)
      entryPoints:
        - web
      priority: 200
      service: keycloak

    seaweedfs-oauth:
      rule: Host(`seaweedfs-bookrush.jteodoro.tec.br`) && PathPrefix(`/oauth2`)
      entryPoints:
        - web
      priority: 400
      service: seaweedfs-oauth

    seaweedfs:
      rule: Host(`seaweedfs-bookrush.jteodoro.tec.br`)
      entryPoints:
        - web
      priority: 300
      service: seaweedfs-oauth

    catalog-docs:
      rule: PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`)
      entryPoints:
        - web
      priority: 110
      service: catalog

    catalog:
      rule: PathPrefix(`/api`)
      entryPoints:
        - web
      priority: 100
      service: catalog

    ingestion:
      rule: PathPrefix(`/ingestion`)
      entryPoints:
        - web
      priority: 100
      middlewares:
        - ingestion-strip
      service: ingestion

    analytics:
      rule: PathPrefix(`/analytics`)
      entryPoints:
        - web
      priority: 100
      middlewares:
        - analytics-strip
      service: analytics

    reader-bff:
      # O BFF expõe somente o feed. As rotas de biblioteca, progresso e
      # bookmarks pertencem ao reader-state-service.
      rule: Path(`/api/v1/reader/feed`)
      entryPoints: [web]
      priority: 140
      service: reader-bff
    reader-state:
      rule: PathPrefix(`/api/v1/library`) || PathPrefix(`/api/v1/reader`)
      entryPoints: [web]
      priority: 125
      service: reader-state
    behavior:
      rule: PathPrefix(`/api/v1/behavior`)
      entryPoints: [web]
      priority: 125
      service: behavior
    publisher:
      rule: PathPrefix(`/api/v1/publisher`)
      entryPoints: [web]
      priority: 130
      service: publisher
    social:
      rule: PathPrefix(`/api/v1/social`)
      entryPoints: [web]
      priority: 130
      service: social
    profile:
      rule: PathPrefix(`/api/v1/profile`)
      entryPoints: [web]
      priority: 130
      service: profile
    admin-api:
      rule: Host(`bookrush.jteodoro.tec.br`) && PathPrefix(`/api/v1/admin`)
      entryPoints: [web]
      priority: 135
      service: admin-api
    content:
      rule: PathPrefix(`/api/v1/content`)
      entryPoints: [web]
      priority: 125
      service: content
    frontend:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      priority: 1
      service: frontend

    admin-web:
      rule: Host(`bookrush.jteodoro.tec.br`) && PathPrefix(`/admin`)
      entryPoints:
        - web
      priority: 150
      service: admin-web

  middlewares:
    ingestion-strip:
      stripPrefix:
        prefixes:
          - /ingestion
    analytics-strip:
      stripPrefix:
        prefixes:
          - /analytics


  services:
    catalog:
      loadBalancer:
        servers:
          - url: http://catalog-service:8080
    ingestion:
      loadBalancer:
        servers:
          - url: http://book-ingestion-service:8090
    analytics:
      loadBalancer:
        servers:
          - url: http://book-analytics-service:8091
    reader-bff:
      loadBalancer:
        servers: [{url: http://reader-bff-service:8101}]
    reader-state:
      loadBalancer:
        servers: [{url: http://reader-state-service:8094}]
    behavior:
      loadBalancer:
        servers: [{url: http://behavior-service:8097}]
    publisher:
      loadBalancer:
        servers: [{url: http://publisher-service:8099}]
    social:
      loadBalancer:
        servers: [{url: http://social-service:8096}]
    profile:
      loadBalancer:
        servers: [{url: http://reader-profile-service:8095}]
    admin-api:
      loadBalancer:
        servers: [{url: http://admin-service:8100}]
    content:
      loadBalancer:
        servers: [{url: http://book-content-service:8093}]
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080
    admin-web:
      loadBalancer:
        servers:
          - url: http://admin-web:80
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080
    seaweedfs-oauth:
      loadBalancer:
        servers:
          - url: http://seaweedfs-oidc:4180
