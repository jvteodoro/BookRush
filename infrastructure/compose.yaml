name: bookrush

services:
  reverse-proxy:
    # Routing is loaded from a file so the proxy does not depend on the Docker
    # API version exposed by the production daemon.
    image: traefik:v3.5.3
    command:
      - --providers.docker=false
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --ping=true
    ports:
      - "127.0.0.1:${BOOKRUSH_PROXY_PORT:-18081}:80"
    volumes:
      # Jenkins runs Compose from inside a container while Docker creates the
      # proxy on the host. Use the host repository path for this bind mount;
      # override BOOKRUSH_REPO_ROOT in .env on another host.
      - ${BOOKRUSH_REPO_ROOT:-/home/enoch/projects/LabSoft/BookRush}/infrastructure/traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bookrush]

  seaweedfs:
    build:
      context: ./seaweedfs
    image: bookrush/seaweedfs:4.46
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:${BOOKRUSH_S3_PORT:-18333}:8333"
    healthcheck:
      # The master/filer ports can be ready before the S3 API accepts requests.
      # Treat the expected unauthenticated S3 403 as ready so dependent apps do
      # not race bucket initialization.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/ && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q '403 Forbidden'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [bookrush]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookrush}
      POSTGRES_USER: ${POSTGRES_USER:-bookrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookrush}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [bookrush]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks: [bookrush]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: [auth]
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # TLS is terminated by the host Nginx. These settings make Keycloak
      # generate redirects and OIDC metadata for the public HTTPS hostname.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/bookrush-realm.json:/opt/keycloak/data/import/bookrush-realm.json:ro
    ports:
      - "127.0.0.1:${BOOKRUSH_KEYCLOAK_PORT:-18088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bookrush]

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BOOKRUSH_PGADMIN_PORT:-18083}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [bookrush]

  catalog-service:
    image: ${BACKEND_IMAGE:-bookrush/catalog-service:local}
    build:
      context: ../services/catalog-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BOOKRUSH_PUBLIC_URL: ${BOOKRUSH_PUBLIC_URL:-https://bookrush.jteodoro.tec.br}
      # The persistent installation already contains V7/V9 checksums from the
      # previous release. Keep validation configurable until Flyway repair is
      # run once against that installation.
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: ${FLYWAY_VALIDATE_ON_MIGRATE:-false}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-bookrush}
      DB_USERNAME: ${POSTGRES_USER:-bookrush}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookrush}
      REDIS_HOST: redis
      STORAGE_ENABLED: "true"
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:8333}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      STORAGE_URL_TTL_SECONDS: ${STORAGE_URL_TTL_SECONDS:-300}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-104857600}
      STORAGE_TIMEOUT: ${STORAGE_TIMEOUT:-30s}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:18333}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      ASSET_ADMIN_TOKEN: ${ASSET_ADMIN_TOKEN:?Set ASSET_ADMIN_TOKEN in .env}
      CANONICAL_SERVICE_TOKEN: ${CANONICAL_SERVICE_TOKEN:-}
      STORAGE_BUCKET_SOURCE: ${STORAGE_BUCKET_SOURCE:-books-source}
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-books-public}
      STORAGE_BUCKET_PROCESSING: ${STORAGE_BUCKET_PROCESSING:-books-processing}
      STORAGE_BUCKET_ML: ${STORAGE_BUCKET_ML:-books-ml}
      STORAGE_BUCKET_RAW: ${STORAGE_BUCKET_RAW:-books-raw}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [bookrush]

  book-ingestion-service:
    image: ${INGESTION_IMAGE:-bookrush/book-ingestion-service:local}
    build:
      context: ../services/book-ingestion-service
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-bookrush}
      DB_USERNAME: ${POSTGRES_USER:-bookrush}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookrush}
      INGESTION_ROLE: ${INGESTION_ROLE:-ALL}
      INGESTION_SCHEDULER_ENABLED: ${INGESTION_SCHEDULER_ENABLED:-false}
      INGESTION_STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:8333}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET_RAW: ${STORAGE_BUCKET_RAW:-books-raw}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8080}
      CANONICAL_SERVICE_TOKEN: ${CANONICAL_SERVICE_TOKEN:-}
      INGESTION_ASSET_TOKEN: ${INGESTION_ASSET_TOKEN:-}
      INGESTION_SECURITY_ENABLED: ${INGESTION_SECURITY_ENABLED:-true}
      INGESTION_OIDC_ISSUER: ${INGESTION_OIDC_ISSUER:-http://keycloak:8080/realms/bookrush}
      INGESTION_OIDC_AUDIENCE: ${INGESTION_OIDC_AUDIENCE:-bookrush-ingestion}
      INGESTION_OIDC_JWK_SET_URI: ${INGESTION_OIDC_JWK_SET_URI:-http://keycloak:8080/realms/bookrush/protocol/openid-connect/certs}
      INGESTION_SECURITY_LOCAL_FIXTURE_MODE: ${INGESTION_SECURITY_LOCAL_FIXTURE_MODE:-false}
      INGESTION_SECURITY_LOCAL_FIXTURE_TOKEN: ${INGESTION_SECURITY_LOCAL_FIXTURE_TOKEN:-}
      INGESTION_PUBLIC_URL: ${INGESTION_PUBLIC_URL:-https://bookrush.jteodoro.tec.br/ingestion}
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:${BOOKRUSH_INGESTION_PORT:-18090}:8090"
    networks: [bookrush]

  frontend:
    image: ${FRONTEND_IMAGE:-bookrush/frontend:local}
    build:
      context: ../frontend
    depends_on:
      catalog-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BOOKRUSH_FRONTEND_PORT:-18080}:8080"
    networks: [bookrush]

  jenkins:
    build:
      context: ./jenkins
    image: bookrush/jenkins:lts
    profiles: [ci]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BOOKRUSH_JENKINS_PORT:-18082}:8080"
      - "127.0.0.1:15000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.env:/run/bookrush.env:ro
      - ./compose.yaml:/opt/bookrush/compose.yaml:ro
      - ./jenkins/bookrush.Jenkinsfile:/opt/bookrush/bookrush.Jenkinsfile:ro
      - ./jenkins/deploy-compose.sh:/opt/bookrush/deploy-compose.sh:ro
      - ./jenkins/init.groovy.d/bookrush.groovy:/var/jenkins_home/init.groovy.d/bookrush.groovy:ro
    group_add:
      - "${DOCKER_GID:-999}"
    networks: [bookrush]

networks:
  bookrush:
    # Keep the service DNS network name stable across deployments.
    name: bookrush_bookrush
    driver: bridge

volumes:
  seaweedfs_data:
  postgres_data:
  redis_data:
  pgadmin_data:
  jenkins_home:
  keycloak_data:
