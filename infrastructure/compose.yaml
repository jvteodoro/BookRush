name: bookrush

services:
  seaweedfs:
    build:
      context: ./seaweedfs
    image: bookrush/seaweedfs:4.46
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:${BOOKRUSH_S3_PORT:-18333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [bookrush]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookrush}
      POSTGRES_USER: ${POSTGRES_USER:-bookrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookrush}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [bookrush]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks: [bookrush]

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BOOKRUSH_PGADMIN_PORT:-18083}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [bookrush]

  catalog-service:
    image: ${BACKEND_IMAGE:-bookrush/catalog-service:local}
    build:
      context: ../services/catalog-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-bookrush}
      DB_USERNAME: ${POSTGRES_USER:-bookrush}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookrush}
      REDIS_HOST: redis
      STORAGE_ENABLED: "true"
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:8333}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      STORAGE_URL_TTL_SECONDS: ${STORAGE_URL_TTL_SECONDS:-300}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-104857600}
      STORAGE_TIMEOUT: ${STORAGE_TIMEOUT:-30s}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:18333}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      ASSET_ADMIN_TOKEN: ${ASSET_ADMIN_TOKEN:?Set ASSET_ADMIN_TOKEN in .env}
      STORAGE_BUCKET_SOURCE: ${STORAGE_BUCKET_SOURCE:-books-source}
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-books-public}
      STORAGE_BUCKET_PROCESSING: ${STORAGE_BUCKET_PROCESSING:-books-processing}
      STORAGE_BUCKET_ML: ${STORAGE_BUCKET_ML:-books-ml}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [bookrush]

  frontend:
    image: ${FRONTEND_IMAGE:-bookrush/frontend:local}
    build:
      context: ../frontend
    depends_on:
      catalog-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BOOKRUSH_FRONTEND_PORT:-18080}:8080"
    networks: [bookrush]

  jenkins:
    build:
      context: ./jenkins
    image: bookrush/jenkins:lts
    profiles: [ci]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BOOKRUSH_JENKINS_PORT:-18082}:8080"
      - "127.0.0.1:15000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.env:/run/bookrush.env:ro
      - ./compose.yaml:/opt/bookrush/compose.yaml:ro
    group_add:
      - "${DOCKER_GID:-999}"
    networks: [bookrush]

networks:
  bookrush:
    driver: bridge

volumes:
  seaweedfs_data:
  postgres_data:
  redis_data:
  pgadmin_data:
  jenkins_home:
