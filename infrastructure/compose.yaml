name: bookrush

services:
  reverse-proxy:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=bookrush
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --ping=true
    ports:
      - "127.0.0.1:${BOOKRUSH_PROXY_PORT:-18081}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bookrush]

  seaweedfs:
    build:
      context: ./seaweedfs
    image: bookrush/seaweedfs:4.46
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:${BOOKRUSH_S3_PORT:-18333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [bookrush]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookrush}
      POSTGRES_USER: ${POSTGRES_USER:-bookrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookrush}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [bookrush]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks: [bookrush]

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BOOKRUSH_PGADMIN_PORT:-18083}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [bookrush]

  catalog-service:
    image: ${BACKEND_IMAGE:-bookrush/catalog-service:local}
    build:
      context: ../services/catalog-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-bookrush}
      DB_USERNAME: ${POSTGRES_USER:-bookrush}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookrush}
      REDIS_HOST: redis
      STORAGE_ENABLED: "true"
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:8333}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      STORAGE_URL_TTL_SECONDS: ${STORAGE_URL_TTL_SECONDS:-300}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-104857600}
      STORAGE_TIMEOUT: ${STORAGE_TIMEOUT:-30s}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:18333}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      ASSET_ADMIN_TOKEN: ${ASSET_ADMIN_TOKEN:?Set ASSET_ADMIN_TOKEN in .env}
      CANONICAL_SERVICE_TOKEN: ${CANONICAL_SERVICE_TOKEN:-}
      STORAGE_BUCKET_SOURCE: ${STORAGE_BUCKET_SOURCE:-books-source}
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-books-public}
      STORAGE_BUCKET_PROCESSING: ${STORAGE_BUCKET_PROCESSING:-books-processing}
      STORAGE_BUCKET_ML: ${STORAGE_BUCKET_ML:-books-ml}
      STORAGE_BUCKET_RAW: ${STORAGE_BUCKET_RAW:-books-raw}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.catalog.rule=PathPrefix(`/api`)
      - traefik.http.routers.catalog.entrypoints=web
      - traefik.http.routers.catalog.priority=100
      - traefik.http.services.catalog.loadbalancer.server.port=8080
    networks: [bookrush]

  book-ingestion-service:
    image: ${INGESTION_IMAGE:-bookrush/book-ingestion-service:local}
    build:
      context: ../services/book-ingestion-service
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-bookrush}
      DB_USERNAME: ${POSTGRES_USER:-bookrush}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookrush}
      INGESTION_ROLE: ${INGESTION_ROLE:-ALL}
      INGESTION_SCHEDULER_ENABLED: ${INGESTION_SCHEDULER_ENABLED:-false}
      INGESTION_STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:8333}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET_RAW: ${STORAGE_BUCKET_RAW:-books-raw}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8080}
      CANONICAL_SERVICE_TOKEN: ${CANONICAL_SERVICE_TOKEN:-}
      INGESTION_SECURITY_ENABLED: ${INGESTION_SECURITY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:${BOOKRUSH_INGESTION_PORT:-18090}:8090"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ingestion.rule=PathPrefix(`/ingestion`)
      - traefik.http.routers.ingestion.entrypoints=web
      - traefik.http.routers.ingestion.priority=100
      - traefik.http.routers.ingestion.middlewares=ingestion-strip
      - traefik.http.middlewares.ingestion-strip.stripprefix.prefixes=/ingestion
      - traefik.http.services.ingestion.loadbalancer.server.port=8090
    networks: [bookrush]

  frontend:
    image: ${FRONTEND_IMAGE:-bookrush/frontend:local}
    build:
      context: ../frontend
    depends_on:
      catalog-service:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=8080
    ports:
      - "127.0.0.1:${BOOKRUSH_FRONTEND_PORT:-18080}:8080"
    networks: [bookrush]

  jenkins:
    build:
      context: ./jenkins
    image: bookrush/jenkins:lts
    profiles: [ci]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BOOKRUSH_JENKINS_PORT:-18082}:8080"
      - "127.0.0.1:15000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.env:/run/bookrush.env:ro
      - ./compose.yaml:/opt/bookrush/compose.yaml:ro
    group_add:
      - "${DOCKER_GID:-999}"
    networks: [bookrush]

networks:
  bookrush:
    driver: bridge

volumes:
  seaweedfs_data:
  postgres_data:
  redis_data:
  pgadmin_data:
  jenkins_home:
