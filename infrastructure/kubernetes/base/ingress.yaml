apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookrush
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - host: bookrush.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: catalog-service, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
