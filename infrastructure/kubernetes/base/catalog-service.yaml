apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog-service }
  template:
    metadata:
      labels: { app: catalog-service }
    spec:
      containers:
        - name: catalog-service
          image: bookrush/catalog-service:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_HOST, value: postgres }
            - { name: REDIS_HOST, value: redis }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: bookrush-db, key: POSTGRES_DB } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: bookrush-db, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bookrush-db, key: POSTGRES_PASSWORD } }
          envFrom: [{ secretRef: { name: bookrush-db } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector: { app: catalog-service }
  ports: [{ port: 8080, targetPort: 8080 }]
