# Opt-in development overlay for compose.yaml and compose.subscription.yaml.
services:
  family-service:
    image: ${FAMILY_IMAGE:-bookrush/family-service:local}
    build:
      context: ..
      dockerfile: services/family-service/Dockerfile
    environment:
      DB_HOST: ${FAMILY_DB_HOST:-postgres}
      DB_NAME: ${FAMILY_DB_NAME:-bookrush}
      DB_USERNAME: ${FAMILY_DB_USERNAME:-}
      DB_PASSWORD: ${FAMILY_DB_PASSWORD:-}
      FAMILY_PRODUCT_ISSUER: ${FAMILY_PRODUCT_ISSUER:-https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush}
      FAMILY_PRODUCT_JWKS: ${FAMILY_PRODUCT_JWKS:-http://keycloak:8080/realms/bookrush/protocol/openid-connect/certs}
      FAMILY_WORKLOAD_ISSUER: ${FAMILY_WORKLOAD_ISSUER:-https://keycloak-bookrush.jteodoro.tec.br/realms/bookrush-platform}
      FAMILY_WORKLOAD_JWKS: ${FAMILY_WORKLOAD_JWKS:-http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/certs}
      FAMILY_TOKEN_URL: ${FAMILY_TOKEN_URL:-http://keycloak:8080/realms/bookrush-platform/protocol/openid-connect/token}
      FAMILY_PRODUCT_ACCESS_WORKLOADS: ${FAMILY_PRODUCT_ACCESS_WORKLOADS:-}
      FAMILY_PRODUCT_ACCESS_AGE_VERIFICATION_REQUIRED: ${FAMILY_PRODUCT_ACCESS_AGE_VERIFICATION_REQUIRED:-false}
      FAMILY_SUBSCRIPTION_CLIENT_SECRET: ${SUBSCRIPTION_FAMILY_CLIENT_SECRET:-}
      FAMILY_IDENTITY_ADMIN_USERS: ${FAMILY_IDENTITY_ADMIN_USERS:-http://keycloak:8080/admin/realms/bookrush/users}
      FAMILY_IDENTITY_TOKEN_URL: ${FAMILY_IDENTITY_TOKEN_URL:-http://keycloak:8080/realms/bookrush/protocol/openid-connect/token}
      FAMILY_IDENTITY_CLIENT_SECRET: ${FAMILY_IDENTITY_CLIENT_SECRET:-}
      SPRING_PROFILES_ACTIVE: ${FAMILY_SPRING_PROFILES:-}
      BOOKRUSH_ENVIRONMENT: ${BOOKRUSH_ENVIRONMENT:-unknown}
      FAMILY_SUPERVISION_SIMULATION: ${FAMILY_SUPERVISION_SIMULATION:-false}
      FAMILY_CORS_ORIGINS: ${FAMILY_CORS_ORIGINS:-}
    profiles: [family]
    depends_on:
      postgres:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8103/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  family-gateway:
    image: traefik:v3.3
    command: ["--entrypoints.web.address=:8080", "--providers.file.filename=/etc/traefik/family.yaml"]
    volumes:
      - ../infrastructure/traefik/family.yaml:/etc/traefik/family.yaml:ro
    ports: ["127.0.0.1:18103:8080"]
    profiles: [family]
    depends_on:
      family-service:
        condition: service_healthy
